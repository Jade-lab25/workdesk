}

var dragId = null;
function bindKanbanEvents(c){
  document.getElementById('kbAdd').addEventListener('click', function(){ openEditor({type:TYPE_TASK,status:ST_TODO,subtasks:[]}); });
  var kbHide = document.getElementById('kbHideDone');
  if(kbHide) kbHide.addEventListener('click', hideAllDone);
  ['kbTypeFilter','kbGoalFilter','kbOwnerFilter'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('change', function(){
      // 筛选值存到 State（v27 修复）：让 select 重建后仍能正确选中对应 option，并避免"全部"看似失效
      if(id==='kbTypeFilter') State.kanbanType = el.value;
      else if(id==='kbGoalFilter') State.kanbanGoal = el.value;
      else if(id==='kbOwnerFilter') State.kanbanOwner = el.value;
      renderKanban();
    });
  });

  c.querySelectorAll('.kcard').forEach(function(card){
    card.addEventListener('dragstart', function(e){
      dragId = card.getAttribute('data-id');
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch(err){}
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); dragId=null; });
    card.querySelector('[data-act="edit"]').addEventListener('click', function(){
      openEditor(State.records.find(function(x){return x.id===card.getAttribute('data-id');}));
    });
    card.querySelector('[data-act="del"]').addEventListener('click', function(){
      var id=card.getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      var label = r && r.type===TYPE_GOAL ? '目标' : '条目';
      if(confirm('删除这个'+label+'？')){ deleteRecord(id).then(function(){ renderAll(); }); }
    });
  });
  c.querySelectorAll('.kcol').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){
      e.preventDefault();
      col.classList.remove('drag-over');
      var id = dragId;
      try { id = e.dataTransfer.getData('text/plain') || dragId; } catch(err){}
      if(!id) return;
      var r = State.records.find(function(x){return x.id===id;});
      if(!r) return;
      var newStatus = col.getAttribute('data-status');
      if(r.status===newStatus) return;
      r.status = newStatus;
      if(newStatus===ST_DONE) r.completedAt=nowISO(); else r.completedAt='';
      // recompute order within column
      var sibs = State.records.filter(function(x){return x.type===TYPE_TASK && x.status===newStatus && x.id!==id;});
      r.order = (sibs.length?Math.max.apply(null,sibs.map(function(s){return s.order||0;})):0)+1;
      updateRecord(r).then(function(){ renderAll(); toast('已移至'+newStatus); });
    });
  });
}

function selectAutoArchive(){
  var today = todayISO();
  return State.records.filter(function(r){
    return r.type===TYPE_TASK && r.status===ST_DONE && r.completedAt &&
      daysBetween(today, (r.completedAt||'').slice(0,10)) < -7;
  });
}
function autoArchiveOldDone(){
  var hits = selectAutoArchive();
  if(!hits.length) return false;
  hits.forEach(function(r){ r.status = ST_ARCHIVE; r.archivedAt = nowISO(); updateRecord(r); });
  return true;
}
function hideAllDone(){
  var hits = State.records.filter(function(r){ return r.type===TYPE_TASK && r.status===ST_DONE; });
  if(!hits.length){ toast('没有已完成任务'); return; }
  if(!confirm('将隐藏所有已完成任务并归入归档区？')) return;

    if(restore) restore.addEventListener('click', function(){
      var r = State.records.find(function(x){return x.id===id;});
      if(!r) return;
      r.status = ST_DONE; r.completedAt = nowISO(); r.archivedAt = '';
      // 恢复即取消该记录的删除标记，防止合并逻辑将其丢弃
      try {
        var dm = JSON.parse(localStorage.getItem(STORAGE_DEL_KEY) || '{}');
        if(dm[r.id]){ delete dm[r.id]; localStorage.setItem(STORAGE_DEL_KEY, JSON.stringify(dm)); }

      updateRecord(r).then(function(){ renderAll(); toast('已恢复到已完成'); });

  });

/* ============ Dashboard view ============ */
var DashState = { range: '30', startDate: '', endDate: '', bdGoal:'', bdStatus:'', bdPriority:'', bdLevel:'' };

function initDashRange(){
  if(DashState.range==='custom') return;  // 保留用户手动指定的日期范围
  var end = new Date();
  if(DashState.range==='all'){
    var earliest = State.records.map(function(x){return x.createdAt;}).filter(Boolean).sort()[0];
    DashState.startDate = earliest ? earliest.slice(0,10) : toISODate(new Date(Date.now()-365*86400000));
  } else {
    var days = parseInt(DashState.range,10);
    var st = new Date(); st.setDate(end.getDate()-(days-1));
    DashState.startDate = toISODate(st);
  }
  DashState.endDate = toISODate(end);
}
function toISODate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function inRange(isoDate, start, end){
  if(!isoDate) return false;
  var day = isoDate.slice(0,10);
  return day >= start && day <= end;
}

function subtaskLeafStatus(s){
  if(s.done || s.status===ST_DONE) return ST_DONE;
  if(s.status===ST_DOING) return ST_DOING;
  return ST_TODO;
}
function subtaskLeafOverdue(s){
  return s.dueDate && subtaskLeafStatus(s)!==ST_DONE && daysBetween(todayISO(), s.dueDate) < 0;
}
function subtaskLeafInRange(s, goalCreatedAt, start, end){
  // 子任务"是否在范围内"按创建时间判定：优先 s.createdAt（新数据已持久化），老数据无 createdAt 时回退目标创建时间。
  // 注意：不能用 dueDate 兜底——dueDate 是截止日期，与创建时间无关；用它判定"新建"会把截止靠后的子任务误排除（v25→v26 实测暴露此 BUG）。
  var date = s.createdAt || goalCreatedAt;
  if(!date) return true;
  return inRange(date, start, end);
}
function wrapSubtaskNode(node){
  var s = node.item;
  var status = subtaskLeafStatus(s);
  var completedAt = s.completedAt || '';
  // v34 修复：旧数据/老格式子任务可能 done=true 但缺少 completedAt，之前用 todayISO() 兜底导致
  // 「范围内已完成」弹层里的完成日期每天都变。改为用创建时间兜底（稳定，不会随日期漂移）。
  if(status===ST_DONE && !completedAt) completedAt = s.createdAt || node.goal.createdAt || '';
  return {
    __subtask: node,
    title: s.text || '',
    status: status,
    priority: s.priority || '',
    dueDate: s.dueDate || '',
    createdAt: s.createdAt || node.goal.createdAt || '',
    completedAt: completedAt
  };
}
function collectGoalSubtaskLeaves(){
  var leaves = [];
  State.records.filter(function(r){return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE;}).forEach(function(g){
    var goalCreatedAt = g.createdAt;
    (g.subtasks||[]).forEach(function(s){
      if(s.children && s.children.length){
        s.children.forEach(function(c){ leaves.push({item:c, goal:g, parent:s}); });
      } else {
        leaves.push({item:s, goal:g, parent:null});
      }
    });
  });
  return leaves;
}

// 统计口径统一由 computeDashStats 计算：renderDashboard 与 KPI 弹层共用同一份结果，保证数字与列表严格一致。
// 所有统计按"任务维度"：目标拆解出的每个子任务叶子（一级叶子/二级叶子）= 1 个任务。
var DashStats = null;
function computeDashStats(start, end){
  var allTasks = State.records.filter(function(r){return r.type===TYPE_TASK && !isRecordHidden(r);});
  var subtaskLeaves = collectGoalSubtaskLeaves();
  var tasksInRange = allTasks.filter(function(r){ return inRange(r.createdAt, start, end); });
  // 包含目标拆解出的子任务，并包装成与任务记录兼容的对象，使后续状态/优先级过滤生效
  subtaskLeaves.forEach(function(node){
    if(subtaskLeafInRange(node.item, node.goal.createdAt, start, end)) tasksInRange.push(wrapSubtaskNode(node));
  });
  // 已完成统计口径：包含"已完成"与"已归档"（已归档任务本质已完成，需纳入完成统计）
  var completedInRange = allTasks.filter(function(r){ return isCompletedOrArchived(r) && inRange(r.completedAt, start, end); });
  // 加上目标拆解中已完成的子任务
  subtaskLeaves.filter(function(node){ return subtaskLeafStatus(node.item)===ST_DONE; }).forEach(function(node){
    var w = wrapSubtaskNode(node);
    if(inRange(w.completedAt, start, end)) completedInRange.push(w);
  });
  var goals = State.records.filter(function(r){return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE && !isRecordHidden(r);});
  var ideas = State.records.filter(function(r){return r.type===TYPE_IDEA && !isRecordHidden(r);});
  var overdue = allTasks.filter(isOverdue);
  // 加上目标拆解中逾期的子任务
  subtaskLeaves.filter(function(node){ return subtaskLeafOverdue(node.item); }).forEach(function(node){ overdue.push(wrapSubtaskNode(node)); });
  var ideasPending = ideas.filter(function(r){return r.status===ST_IDEA;}).length;

  var total = tasksInRange.length;
  var done = completedInRange.length;
  var doing = tasksInRange.filter(function(r){return r.status===ST_DOING;}).length;
  var todo = tasksInRange.filter(function(r){return r.status===ST_TODO;}).length;
  var completionRate = total?Math.round(done/total*100):0;
  // 优先级分布：仅统计"范围内未完成"（终态 已完成/已归档 均不计入，见 isActiveTask）
  var p0 = tasksInRange.filter(function(r){return r.priority==='P0'&&isActiveTask(r);}).length;
  var p1 = tasksInRange.filter(function(r){return r.priority==='P1'&&isActiveTask(r);}).length;
  var p2 = tasksInRange.filter(function(r){return r.priority==='P2'&&isActiveTask(r);}).length;
  var p3 = tasksInRange.filter(function(r){return (r.priority==='P3'||!r.priority)&&isActiveTask(r);}).length;
  return {
    tasksInRange: tasksInRange, completedInRange: completedInRange, overdue: overdue,
    subtaskLeaves: subtaskLeaves, goals: goals, ideas: ideas, ideasPending: ideasPending,
    total: total, done: done, doing: doing, todo: todo, completionRate: completionRate,
    p0: p0, p1: p1, p2: p2, p3: p3
  };
}

function renderDashboard(){
  initDashRange();
  var c = document.getElementById('content');
  var start = DashState.startDate, end = DashState.endDate;
  var D = DashStats = computeDashStats(start, end);
  var total = D.total, done = D.done, doing = D.doing, todo = D.todo;
  var overdue = D.overdue, goals = D.goals, ideas = D.ideas, ideasPending = D.ideasPending;
  var completionRate = D.completionRate;
  var p0 = D.p0, p1 = D.p1, p2 = D.p2, p3 = D.p3;

  var h = '';
  h += '<div style="display:flex;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">';
  h += '<h3 style="font-size:15px;font-weight:700;flex:1">数据仪表盘</h3>';
  h += '<div class="dash-range">';
  [['7','近7天'],['30','近30天'],['90','近90天'],['all','全部']].forEach(function(opt){
    var active = DashState.range==opt[0] ? 'active' : '';
    h += '<button class="dr-btn '+active+'" data-range="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';
  h += '<input type="date" id="dashStart" value="'+start+'" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff">';
  h += '<span style="color:var(--text-3)">至</span>';
  h += '<input type="date" id="dashEnd" value="'+end+'" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff">';
  h += '</div>';
  h += '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px">下列「任务统计 / 优先级 / 完成趋势」按所选时间范围统计；「目标进度 / 逾期任务 / 待转化灵感」为当前状态。</div>';

  h += '<div class="dash-grid">';
  h += '<div class="dcard span-3 kpi" data-kpi="new" title="点击查看关联任务"><div class="num">'+total+'</div><div class="lbl">范围内新建任务</div></div>';
  h += '<div class="dcard span-3 kpi" data-kpi="done" title="点击查看关联任务"><div class="num success">'+done+'</div><div class="lbl">范围内已完成 ('+completionRate+'%)</div></div>';
  h += '<div class="dcard span-3 kpi" data-kpi="doing" title="点击查看关联任务"><div class="num warn">'+doing+'</div><div class="lbl">进行中</div></div>';
  h += '<div class="dcard span-3 kpi" data-kpi="overdue" title="点击查看关联任务"><div class="num danger">'+overdue.length+'</div><div class="lbl">当前逾期任务</div></div>';

  h += '<div class="dcard span-4"><h4>范围内任务完成率<span class="v">'+completionRate+'%</span></h4>';
  h += '<div class="ring-wrap">';
  h += ringSVG(completionRate, 90, [ ['#10b981',completionRate], ['#e5e7eb',100-completionRate] ]);
  h += '<div class="rw-leg">';
  h += legRow('#10b981','已完成', done);
  h += legRow('#f59e0b','进行中', doing);
  h += legRow('#9ca3af','待处理', todo);
  h += '</div></div></div>';

  h += '<div class="dcard span-4"><h4>优先级分布（范围内未完成）</h4>';
  var maxP = Math.max(p0,p1,p2,p3,1);
  h += '<div class="bars">';
  h += barCol('P0', p0, maxP, 'var(--danger)');
  h += barCol('P1', p1, maxP, 'var(--warn)');
  h += barCol('P2', p2, maxP, 'var(--info)');
  h += barCol('P3', p3, maxP, 'var(--text-3)');
  h += '</div></div>';

  h += '<div class="dcard span-4"><h4>目标进度 <span class="v">'+goals.length+'</span></h4>';
  if(goals.length===0){
    h += '<div class="empty-state" style="padding:20px">'+ICONS.target+' 还没有目标</div>';
  } else {
    h += '<div style="display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto">';

// KPI 数字 → 关联任务弹层（只读）。列表与卡片数字同源（DashStats），保证一致
var DASH_POPUP_META = {
  new:  { title:'范围内新建任务', pick:function(D){ return D.tasksInRange; } },
  done: { title:'范围内已完成', pick:function(D){ return D.completedInRange; } },
  doing:{ title:'进行中', pick:function(D){ return D.tasksInRange.filter(function(r){return r.status===ST_DOING;}); } },
  overdue:{ title:'当前逾期任务', pick:function(D){ return D.overdue; } }
};
function showDashPopup(key){
  var meta = DASH_POPUP_META[key];
  if(!meta || !DashStats) return;
  var items = meta.pick(DashStats).slice();
  sortDashPopupItems(key, items);
  document.getElementById('dashPopupTitle').textContent = meta.title+'（'+items.length+' 项）';
  var h = '';
  if(items.length===0){
    h += '<div class="dash-popup-empty">该统计项下暂无任务</div>';
  } else {
    h += '<div class="dash-popup-list">';
    items.forEach(function(r){
      var isSub = !!r.__subtask;
      var title = isSub ? r.__subtask.item.text : r.title;
      var src = isSub ? '<span class="dpsrc">(来自 '+escapeHtml(r.__subtask.goal.title)+')</span>' : '';
      var status = r.status;
      var stCls = status===ST_DONE ? 'done' : (status===ST_DOING ? 'doing' : (status===ST_TODO ? 'todo' : 'arch'));
      var hh = '<div class="dash-popup-row">';
      hh += '<span class="dpt">'+escapeHtml(title)+' '+src+'</span>';
      hh += priorityTag(r.priority);
      if(!isSub && r.owner) hh += ownerTag(r.owner);
      hh += '<span class="dps '+stCls+'">'+escapeHtml(status)+'</span>';
      if(key==='overdue'){
        var due = isSub ? r.__subtask.item.dueDate : r.dueDate;
        var diff = daysBetween(todayISO(), due);
        hh += '<span class="dpd" style="color:var(--danger);font-weight:600">逾期'+Math.abs(diff)+'天</span>';
      } else {
        if(r.dueDate) hh += dueDateBadge(r.dueDate);
        var d = '';
        if(key==='done' && r.completedAt) d = '完成 '+fmtDate(r.completedAt.slice(0,10));
        else if(key==='new' && r.createdAt) d = '创建 '+fmtDate(r.createdAt.slice(0,10));
        if(d) hh += '<span class="dpd">'+d+'</span>';
      }
      hh += '</div>';
      h += hh;
    });
    h += '</div>';
  }
  document.getElementById('dashPopupBody').innerHTML = h;
  document.getElementById('dashPopupMask').classList.add('show');
}
function closeDashPopup(){
  var m = document.getElementById('dashPopupMask');
  if(m) m.classList.remove('show');
}
// KPI 弹层排序：new 按创建时间降序、done 按完成时间降序、overdue 按截止日期升序、其他按截止日期早→晚
function sortDashPopupItems(key, items){
  if(key==='new'){
    items.sort(function(a,b){
      var ca = a.createdAt || '', cb = b.createdAt || '';
      if(ca === cb) return cmpByDueDate(a,b);
      return ca < cb ? 1 : -1;
    });
  } else if(key==='done'){
    items.sort(function(a,b){
      var ca = a.completedAt || '', cb = b.completedAt || '';
      if(ca === cb) return cmpByDueDate(a,b);
      return ca < cb ? 1 : -1;
    });
  } else if(key==='overdue'){
    items.sort(function(a,b){
      var da = a.__subtask ? a.__subtask.item.dueDate : a.dueDate;
      var db = b.__subtask ? b.__subtask.item.dueDate : b.dueDate;
      return (da||'9999').localeCompare(db||'9999');
    });
  } else {
    items.sort(cmpByDueDate);
  }
}

function ringSVG(pct, size, segs){
  var r = (size-12)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  var offset = 0;
  var circles = '';
  segs.forEach(function(s){
    var len = C*s[1]/100;
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s[0]+'" stroke-width="8" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  });
  return '<svg width="'+size+'" height="'+size+'">'+circles+'<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="700" fill="var(--primary)">'+pct+'%</text></svg>';
}

function trendSVG(start, end){
  var s = new Date(start+'T00:00:00');
  var e = new Date(end+'T00:00:00');
  var totalDays = Math.round((e-s)/86400000)+1;
  var step = 1;
  if(totalDays > 45) step = 7;
  else if(totalDays > 21) step = 2;

  // 日期 -> 完成数；口径与「范围内已完成」严格一致：
  //   任务：已完成或已归档，按 completedAt 落日
  //   目标拆解子任务：叶子状态为已完成，按 wrapSubtaskNode.completedAt 落日
  var dayCount = {};
  function bump(iso){
    if(!iso) return;
    var k = iso.slice(0,10);
    if(k < start || k > end) return;
    dayCount[k] = (dayCount[k]||0) + 1;
  }
  State.records.forEach(function(r){
    if(r.type===TYPE_TASK && isCompletedOrArchived(r)) bump(r.completedAt);
  });
  collectGoalSubtaskLeaves().forEach(function(node){
    if(subtaskLeafStatus(node.item)===ST_DONE) bump(wrapSubtaskNode(node).completedAt);
  });

  // 分桶：累加 [i, i+step-1] 内全部日期的完成数，避免只取首日
  var days = [];
  for(var i=0;i<totalDays;i+=step){
    var d = new Date(s); d.setDate(s.getDate()+i);
    var cnt = 0;
    for(var j=0;j<step && (i+j)<totalDays;j++){
      var dd = new Date(s); dd.setDate(s.getDate()+i+j);
      cnt += dayCount[toISODate(dd)] || 0;
    }
    days.push({label:(d.getMonth()+1)+'/'+d.getDate(), count:cnt, key:toISODate(d)});
  }
  var W=440, H=170, pad=30;
  var maxC = Math.max.apply(null, days.map(function(d){return d.count;}).concat([3]));
  var n = days.length;
  var stepX = n>1 ? (W-pad*2)/(n-1) : 0;
  var pts = days.map(function(d,i){
    var x = pad + i*stepX;
    var y = H-pad - (d.count/maxC)*(H-pad*2);
    return {x:x,y:y,d:d};
  });
  var path = pts.map(function(p,i){return (i===0?'M':'L')+p.x+' '+p.y;}).join(' ');
  var area = n>1 ? path + ' L'+pts[pts.length-1].x+' '+(H-pad)+' L'+pts[0].x+' '+(H-pad)+' Z' : '';
  var labelEvery = n > 15 ? Math.ceil(n/10) : 1;
  var h = '<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(var g=0;g<=4;g++){
    var gy = pad + g*(H-pad*2)/4;
    h += '<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="#f3f4f6" stroke-width="1"/>';
  }
  h += '<defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/></linearGradient></defs>';
  if(n>1) h += '<path d="'+area+'" fill="url(#trendGrad)"/>';
  h += '<path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    h += '<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#fff" stroke="#4f46e5" stroke-width="2"/>';
    if(p.d.count>0) h += '<text x="'+p.x+'" y="'+(p.y-8)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#4f46e5">'+p.d.count+'</text>';
    if(i % labelEvery === 0 || i===n-1){
      h += '<text x="'+p.x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#9ca3af">'+p.d.label+'</text>';
    }
  });
  h += '</svg>';
  return h;
}

/* ============ Editor Modal ============ */
var EditorState = { rec: null, isNew: false, goalLinkCallback: null };

function openEditor(rec){
  EditorState.isNew = !rec.id;
  EditorState.rec = Object.assign({ subtasks:[] }, rec);
  if(!EditorState.rec.priority && EditorState.rec.type!==TYPE_GOAL) EditorState.rec.priority='P2';
  if(!EditorState.rec.status){
    EditorState.rec.status = EditorState.rec.type===TYPE_IDEA ? ST_IDEA : ST_TODO;
  }
  document.getElementById('modalTitle').textContent = EditorState.isNew ? '新建事项' : '编辑事项';
  renderEditorBody();
  document.getElementById('modalMask').classList.add('show');
}
function closeEditor(){ document.getElementById('modalMask').classList.remove('show'); }

function renderEditorBody(){
  var r = EditorState.rec;
  var goals = State.records.filter(function(x){return x.type===TYPE_GOAL;});
  var goalOpts = '<option value="">（不关联目标）</option>' + goals.map(function(g){
    return '<option '+(r.goal===g.title?'selected':'')+'>'+escapeHtml(g.title)+'</option>';
  }).join('');

    return '<option '+(r.type===t?'selected':'')+'>'+t+'</option>';
  }).join('');

    return '<option '+(r.status===s?'selected':'')+'>'+s+'</option>';
  }).join('');
  var prioOpts = ['P0','P1','P2','P3'].map(function(p){
    return '<option '+(r.priority===p?'selected':'')+'>'+p+'</option>';
  }).join('');
  var ownerOpts = ['','工作','个人','学习','生活'].map(function(o){
    return '<option value="'+o+'" '+(r.owner===o?'selected':'')+'>'+(o||'未设置')+'</option>';

  body += '<div class="form-row"><label>归属</label><select id="efOwner">'+ownerOpts+'</select></div></div>';

  body += '<div class="form-row"><label>关联目标</label><select id="efGoal">'+goalOpts+'</select></div></div>';

function bindEditorEvents(){
  var subAdd = document.getElementById('efSubAdd');
  var subInput = document.getElementById('efSubInput');
  if(subAdd && subInput){
    var doAdd = function(){
      var v = subInput.value.trim();
      if(!v) return;
      EditorState.rec.subtasks = EditorState.rec.subtasks||[];
      EditorState.rec.subtasks.push(normSub({text:v,done:false,createdAt: nowISO()}));
      renderEditorBody();
    };
    subAdd.addEventListener('click', doAdd);
    subInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){e.preventDefault();doAdd();} });
  }
  document.querySelectorAll('[data-eact="subtoggle"]').forEach(function(b){
    b.addEventListener('click', function(){
      var idx=parseInt(b.getAttribute('data-idx'),10);
      var _sub = EditorState.rec.subtasks[idx];
      _sub.done = !_sub.done;
      if(_sub.done){ if(!_sub.completedAt) _sub.completedAt = nowISO(); }
      else { _sub.completedAt = ''; }
      renderEditorBody();
    });
  });
  document.querySelectorAll('[data-eact="subdel"]').forEach(function(b){
    b.addEventListener('click', function(){
      var idx=parseInt(b.getAttribute('data-idx'),10);
      EditorState.rec.subtasks.splice(idx,1);
      renderEditorBody();
    });
  });
  document.getElementById('efType').addEventListener('change', function(e){
    var t = e.target.value;
    var st = document.getElementById('efStatus');
    if(t===TYPE_IDEA && st.value!==ST_IDEA && st.value!==ST_ARCHIVE){ st.value=ST_IDEA; }
    if(t===TYPE_TASK && st.value===ST_IDEA){ st.value=ST_TODO; }
    if(t===TYPE_GOAL){ st.value=ST_DOING; }
  });
}

function saveEditor(){
  var r = EditorState.rec;
  r.title = document.getElementById('efTitle').value.trim();
  if(!r.title){ toast('请输入标题', true); return; }
  r.type = document.getElementById('efType').value;
  r.status = document.getElementById('efStatus').value;
  r.priority = document.getElementById('efPriority').value;
  r.owner = document.getElementById('efOwner').value;
  r.dueDate = document.getElementById('efDue').value;
  r.goal = document.getElementById('efGoal').value;
  r.tags = document.getElementById('efTags').value.trim();
  r.note = document.getElementById('efNote').value.trim();
  if(r.status===ST_DONE && !r.completedAt) r.completedAt=nowISO();
  if(r.status!==ST_DONE) r.completedAt='';
  if(r.type===TYPE_GOAL && !r.priority) r.priority='P2';
  if(EditorState.isNew){
    r.order = Date.now();
    addRecord(r).then(function(){
      closeEditor(); renderAll(); toast('已创建');
      if(EditorState.goalLinkCallback){ EditorState.goalLinkCallback(r); EditorState.goalLinkCallback=null; }
    });
  } else {
    updateRecord(r).then(function(){
      closeEditor(); renderAll(); toast('已保存');
      if(EditorState.goalLinkCallback){ EditorState.goalLinkCallback(r); EditorState.goalLinkCallback=null; }
    });
  }
}

function openGoalLinker(taskRec){
  var goals = State.records.filter(function(r){return r.type===TYPE_GOAL;});
  if(goals.length===0){
    if(confirm('还没有目标，是否先创建一个目标？')){
      EditorState.goalLinkCallback = function(goal){ taskRec.goal=goal.title; updateRecord(taskRec).then(function(){renderAll();toast('已关联');}); };
      openEditor({ type:TYPE_GOAL, subtasks:[] });
    }
    return;
  }
  EditorState.rec = Object.assign({}, taskRec);
  EditorState.isNew = false;

  document.getElementById('modalMask').classList.add('show');
}

/* ============ Import / Export ============ */
var ExportState = { json:'', blobUrl:'' };
function exportJSON(){
  var data = { version:2, exportedAt:new Date().toISOString(), records: State.records };
  var json = JSON.stringify(data, null, 2);
  ExportState.json = json;
  var filename = 'focusdesk-backup-'+todayISO()+'.json';
  // 清理旧的 blob url
  if(ExportState.blobUrl){ try{URL.revokeObjectURL(ExportState.blobUrl);}catch(e){} }
  var blob = new Blob([json], {type:'application/json;charset=utf-8'});
  ExportState.blobUrl = URL.createObjectURL(blob);

  // 填充面板
  var meta = document.getElementById('exportMeta');
  if(meta) meta.textContent = '共 '+State.records.length+' 条记录，大小 '+(Math.round(json.length/1024*10)/10)+' KB，导出时间 '+new Date().toLocaleString('zh-CN');
  var ta = document.getElementById('exportText');
  if(ta){ ta.value = json; }
  // 下载按钮是真实 <a download>，直接挂 blob URL，用户真实点击即下载（沙箱不拦截真实链接点击）
  var dlBtn = document.getElementById('exportDownload');
  if(dlBtn){
    dlBtn.href = ExportState.blobUrl;
    dlBtn.setAttribute('download', filename);
    dlBtn.textContent = '下载文件（'+filename+'）';
  }
  var cpBtn = document.getElementById('exportCopy');
  if(cpBtn){
    cpBtn.onclick = doCopy;
  }
  var selBtn = document.getElementById('exportSelect');
  if(selBtn){
    selBtn.onclick = function(){
      if(ta){ ta.focus(); ta.select(); try{ ta.setSelectionRange(0, ta.value.length); }catch(e){} }
      toast('已全选，请按 Ctrl+C 复制');
    };
  }
  document.getElementById('exportMask').classList.add('show');
}

function doCopy(){
  var text = ExportState.json;
  var ta = document.getElementById('exportText');
  // 优先用 textarea + execCommand（在沙箱 iframe 中比 navigator.clipboard 成功率高，且是同步可感知结果）
  function fallbackCopy(){
    try {
      if(ta){
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      } else {
        var tmp = document.createElement('textarea');
        tmp.value = text; tmp.style.position='fixed'; tmp.style.opacity='0';
        document.body.appendChild(tmp); tmp.focus(); tmp.select();
      }
      var ok = document.execCommand('copy');
      return ok;
    } catch(e){ return false; }
  }
  // navigator.clipboard 需要安全上下文 + 权限；await 真实结果
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){
      toast('已复制到剪贴板');
    }).catch(function(){
      var ok = fallbackCopy();
      toast(ok ? '已复制到剪贴板' : '复制失败，请手动全选复制', !ok);
    });
  } else {
    var ok = fallbackCopy();
    toast(ok ? '已复制到剪贴板' : '复制失败，请手动全选复制', !ok);
  }
}

function importJSON(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try {
      var data = JSON.parse(e.target.result);
      if(!data.records || !Array.isArray(data.records)) throw new Error('invalid');
      if(!confirm('将导入 '+data.records.length+' 条记录，是否继续？（合并到现有数据，重复ID会覆盖）')) return;
      var now = nowISO();
      var importCount = 0;
      data.records.forEach(function(rec){
        // 导入时刷新 updatedAt，确保 mergeCloudRecords 时本地版本被判定为"更新的"
        // （避免被云端旧版本覆盖导致"导入后刷新反而少了"）
        rec.updatedAt = now;
        var idx = State.records.findIndex(function(x){return x.id===rec.id;});
        if(idx>=0) State.records[idx]=rec; else State.records.push(rec);
        importCount++;
        if(State.online && db && rec.id){
          if(rec.id.indexOf('r_')===0){
            var copy = Object.assign({}, rec); delete copy.id;
            db.addRecord({databaseId:DATABASE_ID, properties:buildProperties(copy)}).catch(function(){});
          } else {
            db.updateRecord({databaseId:DATABASE_ID, recordId:rec.id, properties:buildProperties(rec)}).catch(function(){});
          }
        }
      });
      saveLocal();
      try { localStorage.removeItem(STORAGE_PENDING_KEY); State.pendingOps=[]; } catch(e){}
      renderAll();
      toast('已导入 '+importCount+' 条');
      // 导入后立即主动推送到云端（不等防抖），确保数据先上云再被轮询拉取
      if(window.WB_Cloud && WB_Cloud.enabled && WB_Cloud.isCloud()){
        setSync('syncing','正在上传导入数据...');
        WB_Cloud.pushAll()
          .then(function(){ setSync('', '导入数据已同步'); })
          .catch(function(e){ setSync('offline','上传失败：'+(e&&e.message?e.message:'稍后重试')); });
      }
    } catch(err){
      toast('文件格式无效', true);
    }
  };
  reader.readAsText(file);
}

// 顶部常驻「今日已完成 X · 还有 Y 项未完成」；口径与「范围内已完成」一致
function computeTodayStats(){
  var today = todayISO();
  var done = 0, todo = 0;
  State.records.forEach(function(r){
    if(r.type!==TYPE_TASK) return;
    if(isRecordHidden(r)) return;
    if(isCompletedOrArchived(r)){
      if(r.completedAt && r.completedAt.slice(0,10)===today) done++;
    } else if(isActiveTask(r) && (isOverdue(r) || isToday(r))){
      todo++;
    }
  });
  collectGoalSubtaskLeaves().forEach(function(node){
    var s = node.item, status = subtaskLeafStatus(s);
    if(status===ST_DONE){
      var w = wrapSubtaskNode(node);
      if(w.completedAt && w.completedAt.slice(0,10)===today) done++;
    } else if(status!==ST_ARCHIVE){
      var dueToday = s.dueDate && daysBetween(today, s.dueDate)===0;
      if(subtaskLeafOverdue(s) || dueToday) todo++;
    }
  });
  return { done: done, todo: todo };
}
function updateTopbarStats(){
  var st = computeTodayStats();
  var d = document.getElementById('tsDone'); if(d) d.textContent = st.done;
  var t = document.getElementById('tsTodo'); if(t) t.textContent = st.todo;
}
function updateBadges(){
  // v27 修复：今天要处理 badge 对齐 renderToday items 数量——
  //   主任务(任务类型)：未完成 + (overdue/today/doing)；
  //   子任务叶子：所有未完成（无论 dueDate）。
  // 旧逻辑只算"主任务 overdue+today + 子任务 diff<=0"，漏掉进行中主任务与无 dueDate/远期子任务，与"今天要处理"页面对不上。
  var todayTotal = State.records.filter(function(r){
    return r.type===TYPE_TASK && !isRecordHidden(r) && r.status!==ST_DONE && r.status!==ST_ARCHIVE && (isOverdue(r) || isToday(r) || r.status===ST_DOING);
  }).length;
  State.records.filter(function(r){return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE && r.status!==ST_DONE && !isRecordHidden(r);}).forEach(function(g){
    (g.subtasks||[]).forEach(function(s){
      var leaves = (s.children && s.children.length) ? s.children : [s];
      leaves.forEach(function(ch){
        if(!ch.done) todayTotal++;
      });
    });
  });
  var pendingInbox = State.records.filter(function(r){return !isRecordHidden(r) && ((r.type===TYPE_TASK&&r.status===ST_TODO)||(r.type===TYPE_IDEA&&r.status===ST_IDEA));}).length;
  ['badge-today','mb-today'].forEach(function(id){
    var el = document.getElementById(id);
    if(todayTotal>0){ el.style.display=''; el.textContent=todayTotal; } else { el.style.display='none'; }
  });
  var bi = document.getElementById('badge-inbox');
  if(pendingInbox>0){ bi.style.display=''; bi.textContent=pendingInbox; } else { bi.style.display='none'; }
  var arcCount = State.records.filter(function(r){return r.status===ST_ARCHIVE && !isRecordHidden(r);}).length;
  ['badge-archive','mb-archive'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){
      if(arcCount>0){ el.style.display=''; el.textContent=arcCount; } else { el.style.display='none'; }
    }
  });
}

/* 轻量路径：云端拉取的记录与本地合并（updatedAt 较新者优先；本地独有保留待上推）
 * 修复：之前是"云端优先"，导入/本地修改后若云端 id 相同，会被旧的云端版本覆盖，
 *       导致刚导入的内容被拉取"清空"。改为按时间戳取最新版本。 */
function mergeCloudRecords(cloudRecs){
  // 多端安全：本地残留记录若已被显式删除（删除标记），不参与合并（防止复活后再被推送回云端）
  var delMap = {};
  try { delMap = JSON.parse(localStorage.getItem(STORAGE_DEL_KEY) || '{}'); } catch(e){}
  var now2 = Date.now();
  Object.keys(delMap).forEach(function(did){ if(delMap[did].ts && now2 - delMap[did].ts > 30*24*3600*1000) delete delMap[did]; });
  try { localStorage.setItem(STORAGE_DEL_KEY, JSON.stringify(delMap)); } catch(e){}

  // 取记录的最后更新时间（兼容多个字段，没有则按 0 算）
  function recTime(r){
    if(!r) return 0;
    var t = r.updatedAt || r.updated_at || r.completedAt || r.completed_at || r.createdAt || r.created_at;
    if(!t) return 0;
    var d = new Date(t);
    return isNaN(d.getTime()) ? 0 : d.getTime();
  }

  var cloudMap = {};
  (cloudRecs || []).forEach(function(cr){
    if(cr && cr.id) cloudMap[cr.id] = cr;
  });

  var merged = [];
  var added = {};
  // 先遍历本地：每条与云端对比，取更新时间较新的
  State.records.forEach(function(lr){
    if(!lr || !lr.id) return;
    if(delMap[lr.id]) return; // 已被显式删除的本地残留记录：丢弃
    added[lr.id] = 1;
    var cr = cloudMap[lr.id];
    if(cr){
      // id 相同：取 updatedAt 较新的那条
      merged.push(recTime(lr) >= recTime(cr) ? lr : cr);
    } else {
      // 只有本地有：保留（稍后由 pushAll 推上云端）
      merged.push(lr);
    }
  });
  // 再补云端有但本地没有的（其他设备新增的）
  (cloudRecs || []).forEach(function(cr){
    if(!cr || !cr.id || added[cr.id]) return;
    merged.push(cr);
  });

  // 习惯系统记录：如果云端和本地各有一条 __focusdesk_habits__，保留时间较新的（上面已经按 id 处理了）
  // 但如果云端和本地 id 不同却都是习惯系统记录，只保留一条（取较新的）——兼容 id 规则不同的历史情况
  var habitRecs = merged.filter(function(m){ return m.title === '__focusdesk_habits__'; });
  if(habitRecs.length > 1){
    var newest = habitRecs.reduce(function(a,b){ return recTime(a) >= recTime(b) ? a : b; });
    merged = merged.filter(function(m){ return m.title !== '__focusdesk_habits__'; });
    merged.push(newest);
  }

  State.records = merged;
  saveLocal();
}

  0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
  0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
  0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50
];
var LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
var LUNAR_DAYS = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function leapMonth(y){ return LUNAR_INFO[y-1900] & 0xf; }
function leapDays(y){ if(leapMonth(y)) return (LUNAR_INFO[y-1900]&0x10000)?30:29; return 0; }
function monthDays(y,m){ return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29; }
function lunarYearDays(y){
  var sum = 348;
  for(var i=0x8000;i>0x8;i>>=1) sum += (LUNAR_INFO[y-1900]&i)?1:0;
  return sum + leapDays(y);
}
function solarToLunar(y,m,d){
  var baseDate = Date.UTC(1900,0,31);
  var offset = Math.floor((Date.UTC(y,m,d)-baseDate)/86400000);
  var i, temp=0, isLeap=false, leap=0;
  for(i=1900;i<2050 && offset>0;i++){ temp=lunarYearDays(i); offset-=temp; }
  if(offset<0){ offset+=temp; i--; }
  var lunarY=i;
  leap=leapMonth(i); isLeap=false;
  for(i=1;i<13 && offset>0;i++){
    if(leap>0 && i===(leap+1) && !isLeap){ --i; isLeap=true; temp=leapDays(lunarY); }
    else { temp=monthDays(lunarY,i); }
    if(isLeap && i===(leap+1)) isLeap=false;
    offset-=temp;
  }
  if(offset===0 && leap>0 && i===leap+1){
    if(isLeap) isLeap=false; else { isLeap=true; --i; }
  }
  if(offset<0){ offset+=temp; --i; }
  var lunarM=i, lunarD=offset+1;
  var label = lunarD===1 ? ((isLeap?'闰':'')+LUNAR_MONTHS[lunarM-1]+'月') : LUNAR_DAYS[lunarD-1];
  return { month:lunarM, day:lunarD, isLeap:isLeap, label:label };
}

function buildCalendarEvents(){
  var map = {};
  var today = todayISO();
  function push(date, ev){
    if(!date) return;
    if(!map[date]) map[date] = [];
    map[date].push(ev);
  }
  State.records.forEach(function(r){
    if(isRecordHidden(r)) return;
    if(r.status===ST_ARCHIVE) return;
    if(r.type===TYPE_GOAL){
      if(r.dueDate && r.status!==ST_DONE){
        push(r.dueDate, { kind:'goal', title:r.title, id:r.id, isRecord:true, priority:r.priority, record:r });
      }
      (r.subtasks||[]).forEach(function(s, pidx){
        if(s.children && s.children.length){
          s.children.forEach(function(ch, cidx){
            if(!ch.dueDate) return;
            var done = !!ch.done;
            var diff = daysBetween(today, ch.dueDate);
            var kind = done ? 'done' : (diff<0 ? 'overdue' : 'sub');
            push(ch.dueDate, { kind:kind, title:ch.text, id:r.id, isSub:true, goalId:r.id, pidx:pidx, cidx:cidx, priority:ch.priority, goalTitle:r.title });
          });
        } else {
          if(!s.dueDate) return;
          var done2 = !!s.done;
          var diff2 = daysBetween(today, s.dueDate);
          var kind2 = done2 ? 'done' : (diff2<0 ? 'overdue' : 'sub');
          push(s.dueDate, { kind:kind2, title:s.text, id:r.id, isSub:true, goalId:r.id, pidx:pidx, cidx:-1, priority:s.priority, goalTitle:r.title });
        }
      });
    } else if(r.type===TYPE_IDEA){
      if(r.dueDate) push(r.dueDate, { kind:'idea', title:r.title, id:r.id, isRecord:true, record:r });
    } else {
      if(r.status===ST_DONE){
        var dateOn = (r.completedAt ? r.completedAt.slice(0,10) : r.dueDate);
        if(dateOn) push(dateOn, { kind:'done', title:r.title, id:r.id, isRecord:true, record:r });
      } else if(r.dueDate){
        var d = daysBetween(today, r.dueDate);
        var k = d<0 ? 'overdue' : (r.status===ST_DOING ? 'doing' : 'task');
        push(r.dueDate, { kind:k, title:r.title, id:r.id, isRecord:true, priority:r.priority, record:r });
      }
    }
  });
  // 长期打卡：按重复周期在日历中生成事件（近 120 天历史 ~ 未来 60 天）
  var dayMs = 86400000;
  var todayMs = new Date(today+'T00:00:00').getTime();
  State.habits.forEach(function(hab){
    if(!hab || !hab.title) return;
    var startISO = (hab.createdAt||'').slice(0,10);
    var startMs = startISO ? new Date(startISO+'T00:00:00').getTime() : (todayMs - 120*dayMs);
    var fromMs = Math.max(startMs, todayMs - 120*dayMs);
    var endMs = todayMs + 60*dayMs;
    for(var t=fromMs; t<=endMs; t+=dayMs){
      var d = new Date(t);
      var iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var done = isHabitCompletedOn(hab.id, iso);
      var duePattern;
      if(hab.mode==='count'){
        duePattern = done || (countHabitDoneThisWeek(hab.id, iso) < (hab.countPerWeek||0));
      } else {
        duePattern = hab.weekdays.indexOf(getHabitWeekday(iso))>=0;
      }
      if(!duePattern) continue;
      push(iso, { kind: done ? 'habit-done' : 'habit', title: hab.title, id: hab.id, isHabit: true });
    }
  });
  Object.keys(map).forEach(function(date){
    map[date].sort(function(a,b){
      var rank = { overdue:0, doing:1, task:2, sub:3, goal:4, idea:5, done:6, 'habit':7, 'habit-done':8 };
      var ra = rank[a.kind]!=null?rank[a.kind]:9;
      var rb = rank[b.kind]!=null?rank[b.kind]:9;
      if(ra!==rb) return ra-rb;
      var pa = a.priority==='P0'?0:a.priority==='P1'?1:a.priority==='P2'?2:3;
      var pb = b.priority==='P0'?0:b.priority==='P1'?1:b.priority==='P2'?2:3;
      if(pa!==pb) return pa-pb;
      return (a.title||'').localeCompare(b.title||'');
    });
  });
  return map;
}

function renderCalendarEvent(ev){
  var cls = 'cal-event';
  if(ev.kind==='done') cls += ' ev-done';
  else if(ev.kind==='overdue') cls += ' ev-overdue';
  else if(ev.kind==='doing') cls += ' ev-task ev-doing';
  else if(ev.kind==='task') cls += ' ev-task';
  else if(ev.kind==='goal') cls += ' ev-goal';
  else if(ev.kind==='idea') cls += ' ev-idea';
  else if(ev.kind==='sub') cls += ' ev-sub';
  else if(ev.kind==='habit') cls += ' ev-habit';
  else if(ev.kind==='habit-done') cls += ' ev-habit ev-habit-done';
  var doneAttr = (ev.kind==='done' || ev.kind==='habit-done') ? ' done' : '';
  var h = '<div class="'+cls+'"'+doneAttr+' data-cal-event="1" data-id="'+escapeHtml(ev.id)+'"';
  if(ev.isSub){
    h += ' data-sub="1" data-goal-id="'+escapeHtml(ev.goalId)+'" data-pidx="'+ev.pidx+'" data-cidx="'+ev.cidx+'"';
  } else if(ev.isHabit){
    h += ' data-habit="1"';
  }
  h += ' title="'+escapeHtml(ev.title)+(ev.goalTitle?' · '+escapeHtml(ev.goalTitle):'')+'">';
  h += '<span class="ev-check"></span>';
  h += '<span class="ev-text">'+escapeHtml(ev.title)+'</span>';
  if(ev.priority==='P0' || ev.priority==='P1') h += '<span class="ev-pri">'+ev.priority+'</span>';
  h += '</div>';
  return h;
}

function calEventVisible(e){
  if(!State.calHideDone) return true;
  // v33：勾选「隐藏已完成/长期打卡」时，同时隐藏已完成任务与长期打卡事件
  return e.kind!=='done' && e.kind!=='habit' && e.kind!=='habit-done';
}

function renderCalendar(){
  var c = document.getElementById('content');
  var y = State.calYear, m = State.calMonth;
  var today = todayISO();
  var first = new Date(y,m,1);
  var startWeekday = (first.getDay()+6)%7;
  var daysInMonth = new Date(y,m+1,0).getDate();
  var prevDays = new Date(y,m,0).getDate();
  var eventsByDate = buildCalendarEvents();

  var h = '';
  h += '<div class="cal-toolbar">';
  h += '<div class="cal-nav">';
  h += '<button data-cal-act="prevyear" title="上一年" aria-label="上一年"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 18 11 12 17 6"/><polyline points="11 18 5 12 11 6"/></svg></button>';
  h += '<button data-cal-act="prevmonth" title="上一月" aria-label="上一月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
  h += '<button class="cal-today-btn" data-cal-act="today">今天</button>';
  h += '<button data-cal-act="nextmonth" title="下一月" aria-label="下一月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
  h += '<button data-cal-act="nextyear" title="下一年" aria-label="下一年"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 6 13 12 7 18"/><polyline points="13 6 19 12 13 18"/></svg></button>';
  h += '</div>';
  h += '<div class="cal-title">'+y+'年'+(m+1)+'月</div>';
  h += '<span class="cal-spacer"></span>';
  h += '<label class="cal-toggle"><input type="checkbox" id="calHideDone" '+(State.calHideDone?'checked':'')+'><span class="sw"></span>隐藏已完成/长期打卡</label>';
  h += '</div>';

  h += '<div class="cal-grid">';
  h += '<div class="cal-weekdays">';
  ['周一','周二','周三','周四','周五','周六','周日'].forEach(function(d,i){
    h += '<div class="'+(i>=5?'we':'')+'">'+d+'</div>';
  });
  h += '</div>';
  h += '<div class="cal-body">';
  var totalCells = Math.ceil((startWeekday+daysInMonth)/7)*7;
  for(var i=0;i<totalCells;i++){
    var dayNum, cellDate, otherMonth=false;
    if(i < startWeekday){
      dayNum = prevDays - startWeekday + i + 1;
      cellDate = new Date(y, m-1, dayNum);
      otherMonth = true;
    } else if(i >= startWeekday + daysInMonth){
      dayNum = i - startWeekday - daysInMonth + 1;
      cellDate = new Date(y, m+1, dayNum);
      otherMonth = true;
    } else {
      dayNum = i - startWeekday + 1;
      cellDate = new Date(y, m, dayNum);
    }
    var dateISO = cellDate.getFullYear()+'-'+String(cellDate.getMonth()+1).padStart(2,'0')+'-'+String(cellDate.getDate()).padStart(2,'0');
    var isToday = dateISO===today;
    var weekday = i%7;
    var isWe = weekday>=5;
    var classes = 'cal-cell';
    if(otherMonth) classes += ' other-month';
    if(isToday) classes += ' today';
    if(isWe) classes += ' we';

    h += '<div class="'+classes+'" data-date="'+dateISO+'">';
    h += '<div class="cal-head">';
    var lunarLabel = '';
    if(!otherMonth){
      try {
        var lu = solarToLunar(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
        if(lu.day===1) lunarLabel = lu.label;
        else if(lu.label==='初一') lunarLabel = lu.label;
        else if(cellDate.getDate()===1) lunarLabel = lu.label;
        if(!lunarLabel && (dayNum===1 || lu.day===1)) lunarLabel = lu.label;
      } catch(e){}
    }
    h += '<span class="cal-date">'+dayNum+'</span>';
    if(lunarLabel) h += '<span class="cal-lunar">'+escapeHtml(lunarLabel)+'</span>';
    if(!otherMonth){
      h += '<button class="cal-add" data-cal-act="add" data-date="'+dateISO+'" title="当天新建任务" aria-label="新建"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
    }
    h += '</div>';
    h += '<div class="cal-events">';
    var evs = eventsByDate[dateISO] || [];
    if(State.calHideDone) evs = evs.filter(calEventVisible);
    var maxShow = 4;
    for(var k=0;k<Math.min(evs.length,maxShow);k++){
      h += renderCalendarEvent(evs[k]);
    }
    if(evs.length>maxShow){
      h += '<div class="cal-more" data-cal-act="more" data-date="'+dateISO+'">+'+(evs.length-maxShow)+' 项</div>';
    }
    h += '</div></div>';
  }
  h += '</div></div>';

  h += '<div class="cal-legend">';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#3b82f6"></span>待处理</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#f59e0b"></span>进行中</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#10b981"></span>已完成</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#ef4444"></span>逾期</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#0ea5e9"></span>拆解子任务</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#8b5cf6"></span>目标</span>';
  h += '<span class="lg-item"><span class="lg-dot" style="background:#ec4899"></span>灵感</span>';
  h += '</div>';

  c.innerHTML = h;
  bindCalendarEvents(c);
}

function bindCalendarEvents(c){
  c.querySelectorAll('[data-cal-act]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var act = b.getAttribute('data-cal-act');
      if(act==='prevyear'){ State.calYear--; renderCalendar(); }
      else if(act==='nextyear'){ State.calYear++; renderCalendar(); }
      else if(act==='prevmonth'){
        State.calMonth--;
        if(State.calMonth<0){ State.calMonth=11; State.calYear--; }
        renderCalendar();
      }
      else if(act==='nextmonth'){
        State.calMonth++;
        if(State.calMonth>11){ State.calMonth=0; State.calYear++; }
        renderCalendar();
      }
      else if(act==='today'){
        var now = new Date();
        State.calYear = now.getFullYear();
        State.calMonth = now.getMonth();
        renderCalendar();
      }
      else if(act==='add'){
        var date = b.getAttribute('data-date');
        openEditor({ type:TYPE_TASK, status:ST_TODO, subtasks:[], dueDate:date });
      }
    });
  });
  var hideChk = document.getElementById('calHideDone');
  if(hideChk){
    hideChk.addEventListener('change', function(){
      State.calHideDone = hideChk.checked;
      renderCalendar();
    });
  }
  c.querySelectorAll('[data-cal-event="1"]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var id = el.getAttribute('data-id');
      var isSub = el.getAttribute('data-sub')==='1';
      var isHabit = el.getAttribute('data-habit')==='1';
      if(isHabit){
        var hab = State.habits.find(function(x){return x.id===id;});
        if(hab) openHabitEditor(hab);
      } else if(isSub){
        var gid = el.getAttribute('data-goal-id');
        var pidx = parseInt(el.getAttribute('data-pidx'),10);
        var cidx = parseInt(el.getAttribute('data-cidx'),10);
        var g = State.records.find(function(x){return x.id===gid;});
        // v28 修复：日历中一级叶子子任务 cidx=-1（表示"一级叶子"），若直接传给 openSubEditor 会被当作
        //   "新建二级任务"（cidx===-1 语义）。应传 null 才表示"编辑一级任务"。
        if(g) openSubEditor(g, pidx, (cidx===-1 ? null : cidx));
      } else {
        var r = State.records.find(function(x){return x.id===id;});
        if(r) openEditor(r);
      }
    });
    // Long-press / checkbox area to toggle done quickly
    var cb = el.querySelector('.ev-check');
    if(cb){
      cb.addEventListener('click', function(e){
        e.stopPropagation();
        var id = el.getAttribute('data-id');
        var isSub = el.getAttribute('data-sub')==='1';
        var isHabit = el.getAttribute('data-habit')==='1';
        if(isHabit){
          markHabitDone(id);
        } else if(isSub){
          var gid = el.getAttribute('data-goal-id');
          var pidx = parseInt(el.getAttribute('data-pidx'),10);
          var cidx = parseInt(el.getAttribute('data-cidx'),10);
          var g2 = State.records.find(function(x){return x.id===gid;});
          if(!g2) return;
          var parent = g2.subtasks[pidx];
          if(cidx===-1){
            parent.done = !parent.done;
            parent.status = parent.done ? ST_DONE : ST_TODO;
            parent.completedAt = parent.done ? nowISO() : '';
          } else {
            parent.children[cidx].done = !parent.children[cidx].done;
            parent.children[cidx].completedAt = parent.children[cidx].done ? nowISO() : '';
            var st = computeSubStatus(parent);
            parent.status = st;
            parent.done = (st===ST_DONE);
            parent.completedAt = (st===ST_DONE) ? (parent.completedAt || nowISO()) : '';
          }
          updateRecord(g2).then(function(){ renderAll(); toast(parent.done?'已完成':'已恢复'); });
        } else {
          var rec = State.records.find(function(x){return x.id===id;});
          if(!rec) return;
          if(rec.status===ST_DONE){ rec.status=ST_TODO; rec.completedAt=''; }
          else { rec.status=ST_DONE; rec.completedAt=nowISO(); }
          updateRecord(rec).then(function(){ renderAll(); toast(rec.status===ST_DONE?'已完成':'已恢复'); });
        }
      });
    }
  });
  c.querySelectorAll('.cal-more').forEach(function(m){
    m.addEventListener('click', function(e){
      e.stopPropagation();
      var date = m.getAttribute('data-date');
      var evs = buildCalendarEvents()[date] || [];
      if(State.calHideDone) evs = evs.filter(calEventVisible);
      var titles = evs.map(function(ev,i){ return (i+1)+'. '+ev.title; }).join('\n');
      alert(date+' 共 '+evs.length+' 项：\n\n'+titles);
    });
  });
}

</script>

<script>

(function(){

  var ENABLED = SUPABASE_URL.indexOf('__VITE') !== 0 && !!SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf('__VITE') !== 0;

  var supabase = null;

  var localMode = false;
  var pushTimer = null;
  var _syncing = false; // 防重入：轮询/手动/防抖共用同一把锁
  var authedCallbacks = [];

  function nowISO(){ return new Date().toISOString(); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function uid(){ return 'r_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function ensureSDK(){
    if(!ENABLED) return false;
    if(!supabase){
      if(!window.supabase) return false;
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
    return true;
  }

  /* 对外 CRUD 接口（与原版 addRecord/updateRecord/deleteRecord 对接）
   * 说明：原版 CRUD 在调用 db 前已 saveLocal()，云端写入统一由
   * saveLocal → schedulePush → pushAll(reconcile) 完成，这里只确认成功。 */
  var db = {
    addRecord: function(){ schedulePush(); return Promise.resolve({}); },
    updateRecord: function(){ schedulePush(); return Promise.resolve({}); },
    deleteRecord: function(){ schedulePush(); return Promise.resolve({}); }
  };

  /* 枚举映射（原版中文 ⇄ 表英文） */
  var STATUS_MAP = { '待处理':'todo', '进行中':'doing', '已完成':'done', '待转化':'idea', '已归档':'archived' };
  var STATUS_RMAP = { todo:'待处理', doing:'进行中', done:'已完成', idea:'待转化', archived:'已归档' };
  var GOAL_STATUS_MAP = { '待处理':'active', '进行中':'active', '已完成':'done', '已归档':'archived' };
  var GOAL_STATUS_RMAP = { active:'进行中', paused:'进行中', done:'已完成', archived:'已归档' };

  /* ---------- 登录 / 注册 / 退出 ---------- */
  function showAuth(){ var m = document.getElementById('authMask'); if(m) m.style.display = 'flex'; }
  function hideAuth(){ var m = document.getElementById('authMask'); if(m) m.style.display = 'none'; }
  function authMsg(text, isErr){
    var el = document.getElementById('authMsg'); if(!el) return;
    el.textContent = text; el.className = 'auth-msg ' + (isErr ? 'err' : 'ok'); el.style.display = 'block';
  }
  function clearAuthMsg(){ var el = document.getElementById('authMsg'); if(el) el.style.display = 'none'; }
  function onAuthed(user){
    currentUser = user; localMode = false;
    hideAuth();
    authedCallbacks.forEach(function(fn){ try{ fn(user); }catch(e){ console.warn(e); } });
  }

  function init(){
    if(!ensureSDK()){ authedCallbacks.forEach(function(fn){ fn(null); }); return; }
    supabase.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(session && session.user){ onAuthed(session.user); }
      else { showAuth(); authedCallbacks.forEach(function(fn){ fn(null); }); }
    }).catch(function(){ showAuth(); authedCallbacks.forEach(function(fn){ fn(null); }); });
  }

  function bindAuthUI(){
    var emailEl = document.getElementById('authEmail');
    var pwdEl = document.getElementById('authPwd');
    var pwd2El = document.getElementById('authPwd2');
    var pwd2Wrap = document.getElementById('authPwd2Wrap');
    var submitEl = document.getElementById('authSubmit');
    var toggleEl = document.getElementById('authToggle');
    var localEl = document.getElementById('authLocal');
    var isSignUp = false;

    function setBusy(b){ submitEl.disabled = b; submitEl.textContent = b ? '处理中...' : (isSignUp ? '注 册' : '登 录'); }
    function toggleMode(){
      isSignUp = !isSignUp;
      pwd2Wrap.style.display = isSignUp ? 'block' : 'none';
      toggleEl.textContent = isSignUp ? '已有账户？去登录' : '没有账户？注册一个';
      submitEl.textContent = isSignUp ? '注 册' : '登 录';
      clearAuthMsg();
    }
    function doAuth(){
      var email = emailEl.value.trim();
      var pwd = pwdEl.value;
      if(!email || !pwd){ authMsg('请输入邮箱和密码', true); return; }
      if(isSignUp){
        if(pwd.length < 6){ authMsg('密码至少 6 位', true); return; }
        if(pwd !== pwd2El.value){ authMsg('两次输入的密码不一致', true); return; }
      }
      setBusy(true);
      var p = isSignUp ? supabase.auth.signUp({ email: email, password: pwd })
                       : supabase.auth.signInWithPassword({ email: email, password: pwd });
      p.then(function(res){
        setBusy(false);
        if(res.error){ authMsg(res.error.message, true); return; }
        if(isSignUp){
          if(res.data && res.data.session && res.data.session.user){ onAuthed(res.data.session.user); }
          else { authMsg('注册成功，请登录', false); isSignUp = false; toggleMode(); }
          return;
        }
        if(res.data && res.data.session && res.data.session.user){ onAuthed(res.data.session.user); }
        else { authMsg('登录失败，请重试', true); }
      }).catch(function(e){ setBusy(false); authMsg(e.message || '网络错误', true); });
    }
    submitEl.addEventListener('click', doAuth);
    toggleEl.addEventListener('click', toggleMode);
    localEl.addEventListener('click', function(){
      localMode = true; currentUser = null;
      hideAuth();
      authedCallbacks.forEach(function(fn){ try{ fn(null); }catch(e){} });
    });
    emailEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ pwdEl.focus(); } });
    pwdEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ isSignUp ? pwd2El.focus() : doAuth(); } });
    pwd2El.addEventListener('keydown', function(e){ if(e.key==='Enter'){ doAuth(); } });
  }

  function signOut(){
    if(!supabase) return;
    supabase.auth.signOut().then(function(){
      currentUser = null;
      showAuth();
      setSync('offline','已退出登录，数据保留在本机');
    });
  }

  /* ---------- 数据转换（本地 rec ⇄ 表行） ---------- */
  function goalToRow(rec, userId, now){
    return {
      id: rec.id, user_id: userId, title: rec.title,
      description: rec.note || null,
      status: GOAL_STATUS_MAP[rec.status] || 'active',
      progress: 0,
      sort: typeof rec.order === 'number' ? rec.order : 0,
      subtasks: JSON.stringify(rec.subtasks || []),
      created_at: rec.createdAt || now, updated_at: now, synced_at: now
    };
  }
  function taskToRow(rec, userId, now, goalIdByTitle){
    return {
      id: rec.id, user_id: userId,
      goal_id: (rec.goal && goalIdByTitle[rec.goal]) ? goalIdByTitle[rec.goal] : null,
      title: rec.title,
      fd_type: rec.type === '灵感' ? 'idea' : 'task',
      status: STATUS_MAP[rec.status] || 'todo',
      priority: rec.priority || '', owner: rec.owner || '',
      due_date: rec.dueDate || '', tags: rec.tags || '', note: rec.note || '',
      subtasks: JSON.stringify(rec.subtasks || []),
      sort: typeof rec.order === 'number' ? rec.order : 0,
      completed_at: rec.completedAt || null,
      created_at: rec.createdAt || now, updated_at: now, synced_at: now
    };
  }
  function goalFromRow(g){
    var subs = [];
    try { subs = typeof g.subtasks === 'string' ? JSON.parse(g.subtasks) : (g.subtasks || []); } catch(e){ subs = []; }
    return { id: g.id, title: g.title, type: '目标', status: GOAL_STATUS_RMAP[g.status] || '进行中',
      priority: '', owner: '', dueDate: '', tags: '', note: g.description || '',
      subtasks: subs, createdAt: g.created_at || '', updatedAt: g.updated_at || '', completedAt: '',
      order: g.sort || 0 };
  }
  function taskFromRow(t, goalById){
    var goalTitle = '';
    if(t.goal_id && goalById[t.goal_id]) goalTitle = goalById[t.goal_id].title;
    var subs = [];
    try { subs = typeof t.subtasks === 'string' ? JSON.parse(t.subtasks) : (t.subtasks || []); } catch(e){ subs = []; }
    return { id: t.id, title: t.title, type: t.fd_type === 'idea' ? '灵感' : '任务',
      status: STATUS_RMAP[t.status] || '待处理',
      priority: t.priority || '', owner: t.owner || '', dueDate: t.due_date || '',
      tags: t.tags || '', note: t.note || '', subtasks: subs,
      goal: goalTitle, createdAt: t.created_at || '', updatedAt: t.updated_at || '', completedAt: t.completed_at || '',
      order: t.sort || 0 };
  }
  function habitToRow(h, userId, now){
    return {
      id: h.id || uid(), user_id: userId, name: h.title || '',
      weekdays: JSON.stringify(h.weekdays || []),
      note: h.note || '', mode: h.mode === 'count' ? 'count' : 'weekday',
      count_per_week: parseInt(h.countPerWeek, 10) || 0,
      sort: 0, created_at: now, synced_at: now
    };
  }
  function habitFromRow(h){
    var wd = [];
    try { wd = typeof h.weekdays === 'string' ? JSON.parse(h.weekdays) : (h.weekdays || []); } catch(e){ wd = []; }
    return { id: h.id, title: h.name || '', note: h.note || '',
      mode: h.mode === 'count' ? 'count' : 'weekday', weekdays: wd,
      countPerWeek: h.count_per_week || 0,
      createdAt: h.created_at ? h.created_at.slice(0,10) : todayStr() };
  }

  /* ---------- 拉取云端 → 本地格式 ---------- */
  function fetchAll(){
    if(!currentUser) return Promise.resolve([]);
    var u = currentUser.id;
    var q = function(t){ return supabase.from(t).select('*').eq('user_id', u); };
    return Promise.all([q('fd_goals'), q('fd_tasks'), q('fd_habits'), q('fd_habit_logs')])
      .then(function(rs){
        for(var i=0;i<rs.length;i++){ if(rs[i].error) throw new Error(rs[i].error.message); }
        var goals = rs[0].data || [], tasks = rs[1].data || [], habits = rs[2].data || [], hlogs = rs[3].data || [];
        var goalById = {}; goals.forEach(function(g){ goalById[g.id] = g; });
        var recs = [];
        goals.forEach(function(g){ recs.push(goalFromRow(g)); });
        tasks.forEach(function(t){ recs.push(taskFromRow(t, goalById)); });
        if(habits.length || hlogs.length){
          recs.push({
            id: '__focusdesk_habits__', title: '__focusdesk_habits__', type: '任务', status: '待处理',
            note: '', subtasks: [],
            habits: habits.map(habitFromRow),
            habitLogs: hlogs.map(function(l){ return { habitId: l.habit_id, date: l.log_date, completedAt: l.completed_at || '' }; }),
            createdAt: nowISO(), order: 0
          });
        }
        return recs;
      });
  }

  /* 安全 upsert：整批失败 → 逐条尝试（跳过约束/外键问题记录，task 外键失败时去掉 goal_id 重试），避免一条坏记录阻断全部上云 */
  function safeUpsert(table, rows, stripGoal, skipped){
    return supabase.from(table).upsert(rows, { onConflict: 'id' }).then(function(r){
      if(!r.error) return r;
      console.warn('[Cloud] batch upsert failed on ' + table + ': ' + r.error.message + ' → retry one by one');
      var p = Promise.resolve(); var ok = 0;
      rows.forEach(function(row){
        p = p.then(function(){
          return supabase.from(table).upsert([row], { onConflict: 'id' }).then(function(rr){
            if(!rr.error){ ok++; return; }
            if(stripGoal && row.goal_id){
              var clean = JSON.parse(JSON.stringify(row)); delete clean.goal_id;
              return supabase.from(table).upsert([clean], { onConflict: 'id' }).then(function(rr2){
                if(!rr2.error){ ok++; return; }
                skipped.push((row.title || row.id) + ' :: ' + rr2.error.message);
              });
            }
            skipped.push((row.title || row.id) + ' :: ' + rr.error.message);
          });
        });
      });
      return p.then(function(){
        // 全部失败时抛出错误，避免 pushAll 假"成功"
        if(ok === 0) throw new Error(table + ' 全部 ' + rows.length + ' 条插入失败：' + r.error.message);
        return { data: null, error: null, okCount: ok, total: rows.length };
      });
    });
  }

  /* ---------- 全量 reconcile（本地 ⇄ 云端双向对齐） ----------
   * 覆盖：新增/修改（upsert）+ 删除（云端有本地无 → 删）+ 导入替换
   * habit_logs：RLS 无 UPDATE 策略 → 按习惯"删全量再重插"，避免冲突与重复 */
  function pushAll(){
    if(!currentUser || !supabase) return Promise.resolve();
    if(_syncing) return Promise.resolve(); // 防重入：已有同步在进行，跳过本次
    _syncing = true;
    var u = currentUser.id;
    var now = nowISO();
    var goals = [], tasks = [], habits = [], hlogs = [];
    var sysRec = null;
    var localGoalIds = {}, localTaskIds = {}, localHabitIds = {};
    var goalIdByTitle = {};
    State.records.forEach(function(rec){
      if(rec.title === '__focusdesk_habits__'){ sysRec = rec; return; }
      if(rec.type === '目标'){
        goals.push(goalToRow(rec, u, now));
        goalIdByTitle[rec.title] = rec.id;
        localGoalIds[rec.id] = 1;
      } else {
        tasks.push(taskToRow(rec, u, now, goalIdByTitle));
        localTaskIds[rec.id] = 1;
      }
    });
    if(sysRec){
      (sysRec.habits || []).forEach(function(h){ habits.push(habitToRow(h, u, now)); localHabitIds[h.id] = 1; });
      hlogs = sysRec.habitLogs || [];
    }
    var sel = function(t, cols){ return supabase.from(t).select(cols).eq('user_id', u); };
    // 多端安全：云端删除只针对用户显式删除的记录（删除标记），不再「云端有本地无就删」，避免多个浏览器互相清数据
    var delMap = {};
    try { delMap = JSON.parse(localStorage.getItem(STORAGE_DEL_KEY) || '{}'); } catch(e){}
    var goalDelIds = [], taskDelIds = [], habitDelIds = [];
    Object.keys(delMap).forEach(function(did){
      var d = delMap[did];
      if(!d || !d.table) return;
      if(d.table === 'fd_goals') goalDelIds.push(did);
      else if(d.table === 'fd_tasks') taskDelIds.push(did);
      else if(d.table === 'fd_habits') habitDelIds.push(did);
    });
    return Promise.all([sel('fd_goals','id,user_id'), sel('fd_tasks','id,user_id'), sel('fd_habits','id,user_id')])
      .then(function(rs){
        var dels = [];
        goalDelIds.forEach(function(did){ dels.push(supabase.from('fd_goals').delete().eq('id', did)); });
        taskDelIds.forEach(function(did){ dels.push(supabase.from('fd_tasks').delete().eq('id', did)); });
        if(habitDelIds.length){
          dels.push(supabase.from('fd_habit_logs').delete().eq('user_id', u).in('habit_id', habitDelIds));
          dels.push(supabase.from('fd_habits').delete().eq('user_id', u).in('id', habitDelIds));
        }
        return Promise.all(dels);
      })
      .then(function(delRs){
        for(var i=0;i<(delRs||[]).length;i++){ if(delRs[i] && delRs[i].error) throw new Error(delRs[i].error.message); }
        var skipped = [];
        var p = Promise.resolve();
        if(goals.length) p = p.then(function(){ return safeUpsert('fd_goals', goals, false, skipped); });
        if(tasks.length) p = p.then(function(){ return safeUpsert('fd_tasks', tasks, true, skipped); });
        if(habits.length) p = p.then(function(){ return safeUpsert('fd_habits', habits, false, skipped); });
        return p.then(function(){ return skipped; });
      })
      .then(function(skipped){
        if(!sysRec) return { skipped: skipped };
        var logs = hlogs.map(function(l){
          return { id: uid(), user_id: u, habit_id: l.habitId, log_date: l.date,
                   created_at: now, synced_at: now, completed_at: l.completedAt || null };
        });
        if(!logs.length) return Promise.resolve();
        var habitIds = {};
        logs.forEach(function(l){ habitIds[l.habit_id] = 1; });
        var p = Promise.resolve();
        Object.keys(habitIds).forEach(function(hid){
          p = p.then(function(){ return supabase.from('fd_habit_logs').delete().eq('user_id', u).eq('habit_id', hid); });
        });
        return p.then(function(){ return supabase.from('fd_habit_logs').insert(logs); })
          .then(function(r2){ if(r2 && r2.error) throw new Error(r2.error.message); return { skipped: skipped }; });
      })
      .then(function(r){
        return r;
      })
      .then(function(){ _syncing = false; })
      .catch(function(e){ _syncing = false; throw e; });
  }

  /* ---------- 保存挂钩：变更后防抖全量推送 ---------- */
  function schedulePush(){
    if(!currentUser || localMode) return;
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){
      pushTimer = null;
      setSync('syncing','同步中...');
      pushAll().then(function(syncRes){
          if(syncRes && syncRes.skipped && syncRes.skipped.length){
            try { localStorage.setItem('wb_focusdesk_skipped', JSON.stringify(syncRes.skipped)); } catch(e){}
            setSync('offline','已同步（跳过 ' + syncRes.skipped.length + ' 条问题记录，详情见控制台）');
          } else { setSync('', '已同步'); }
        })
        .catch(function(e){
          console.warn('[Cloud] push failed', e);
          setSync('offline','同步失败：' + (e && e.message ? e.message : '稍后重试'));
          schedulePush();
        });
    }, 300);
  }

  /* ---------- 对外接口 ---------- */
  window.WB_Cloud = {
    enabled: ENABLED,
    init: function(onReady){
      authedCallbacks.push(onReady);
      if(!ENABLED){ onReady(null); return; }
      ensureSDK();
      bindAuthUI();
      init();
    },
    db: db,
    fetchAll: fetchAll,
    pushAll: pushAll,
    schedulePush: schedulePush,
    syncing: function(){ return _syncing; },
    signOut: signOut,
    user: function(){ return currentUser; },
    isCloud: function(){ return !!currentUser && !localMode; }
  };
})();
</script>
