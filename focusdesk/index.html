:root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;--bg:#f5f6fa;--card:#fff;--text:#1f2937;--text-2:#6b7280;--text-3:#9ca3af;--border:#e5e7eb;--border-2:#f3f4f6;--danger:#dc2626;--danger-bg:#fef2f2;--warn:#d97706;--warn-bg:#fffbeb;--success:#059669;--success-bg:#ecfdf5;--info:#0284c7;--info-bg:#f0f9ff;--p0:#dc2626;--p1:#d97706;--p2:#2563eb;--p3:#6b7280;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);--radius:12px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;display:flex;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

.sidebar-logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-2)}
.sidebar-logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.sidebar-logo h1{font-size:16px;font-weight:700;line-height:1.2}
.sidebar-logo small{display:block;font-size:11px;color:var(--text-3);font-weight:400;margin-top:2px}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);color:var(--text-2);font-weight:500;margin-bottom:2px;width:100%;text-align:left;transition:all .15s}
.nav-item:hover{background:var(--primary-light);color:var(--primary)}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.25)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item .badge{margin-left:auto;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.nav-item:not(.active) .badge{background:var(--danger);color:#fff}
.nav-item.active .badge{background:rgba(255,255,255,.25)}
.sidebar-foot{padding:14px;border-top:1px solid var(--border-2);font-size:11px;color:var(--text-3)}
.sync{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}

.sync .dot.offline{background:var(--text-3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}

.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}

.topbar-stats b{font-weight:700;font-size:14px}
.topbar-stats .ts-done b{color:var(--success)}
.topbar-stats .ts-todo b{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:inherit;transition:all .15s;border:1px solid transparent;white-space:nowrap;min-height:36px;cursor:pointer;text-decoration:none}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}

.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px}
.btn-icon{padding:7px;border-radius:8px;min-height:auto}
.btn-icon:hover{background:var(--primary-light)}
.content{padding:24px 28px 60px;max-width:1280px;width:100%;margin:0 auto}
.today{background:linear-gradient(135deg,#fff 0%,#fafbff 100%);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;box-shadow:var(--shadow)}
.today-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.today-head h3{font-size:15px;font-weight:700}
.today-head .count{background:var(--danger);color:#fff;font-size:11px;padding:2px 9px;border-radius:10px;font-weight:600}
.today-head .count.zero{background:var(--success)}
.today-list{display:flex;flex-direction:column;gap:8px}
.today-empty{color:var(--text-3);font-size:13px;padding:8px 4px}
.today-clear{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 20px 18px}
.today-clear .tc-icon{width:56px;height:56px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.today-clear .tc-icon svg{width:28px;height:28px}
.today-clear .tc-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.today-clear .tc-sub{font-size:13px;color:var(--text-2);margin-bottom:14px}
.today-clear .tc-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.today-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius-sm);border-left:3px solid var(--primary);flex-wrap:wrap}
.today-item.overdue{border-left-color:var(--danger);background:var(--danger-bg)}
.today-item.today-due{border-left-color:var(--warn)}
.today-item .ti-title{flex:1;font-weight:500;min-width:140px}
.today-item.overdue .ti-title{color:var(--danger)}
.ti-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tag-p0{background:#fee2e2;color:var(--p0)}.tag-p1{background:#fef3c7;color:var(--p1)}.tag-p2{background:#dbeafe;color:var(--p2)}.tag-p3{background:#f3f4f6;color:var(--p3)}
.tag-work{background:#ede9fe;color:#6d28d9}.tag-personal{background:#fce7f3;color:#be185d}.tag-study{background:#d1fae5;color:#047857}.tag-life{background:#cffafe;color:#0e7490}
.tag-goal{background:#fef3c7;color:#b45309}.tag-idea{background:#fae8ff;color:#a21caf}.tag-task{background:#dbeafe;color:#1d4ed8}
.tag-subtask{background:#ede9fe;color:#6d28d9}
.today-item .ti-body{flex:1;min-width:140px}
.today-item .ti-body .ti-title{min-width:0}
.ti-cb{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;cursor:pointer;transition:all .15s;position:relative}
.ti-cb:hover{border-color:var(--primary);background:var(--primary-light)}
.ti-cb:active{transform:scale(.9)}
.sub-reason{font-size:11px;color:var(--text-3);font-weight:500}
.due{font-size:12px}.due.overdue{color:var(--danger);font-weight:600}
.view{display:none;animation:fade .2s}.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.inbox-tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);padding:4px;border-radius:var(--radius-sm);border:1px solid var(--border);width:fit-content}
.inbox-tab{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-2)}
.inbox-tab.active{background:var(--primary);color:#fff}
.quick-add{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.quick-add textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;resize:vertical;min-height:46px;outline:none;transition:border .15s}
.quick-add textarea:focus{border-color:var(--primary)}
.qa-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.qa-row select,.qa-row input[type=date],.qa-row input[type=text]{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;background:#fff}
.qa-row select:focus,.qa-row input:focus{border-color:var(--primary)}
.qa-spacer{flex:1}
.section-title{font-size:13px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .ln{flex:1;height:1px;background:var(--border)}
.item-list{display:flex;flex-direction:column;gap:8px}
.list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;display:flex;align-items:flex-start;gap:12px;transition:box-shadow .15s}
.list-item:hover{box-shadow:var(--shadow)}
.li-check{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.li-check:hover{border-color:var(--primary)}
.li-check.done{background:var(--success);border-color:var(--success)}
.li-check.done svg{display:block}
.li-check svg{width:12px;height:12px;color:#fff;display:none}
.li-body{flex:1;min-width:0}
.li-title{font-weight:500;margin-bottom:4px;word-break:break-word}
.li-title.done{text-decoration:line-through;color:var(--text-3)}
.li-note{font-size:12px;color:var(--text-2);margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.li-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li-actions{display:flex;gap:2px;flex-shrink:0}
@media(hover:hover){.list-item .li-actions{opacity:.4}.list-item:hover .li-actions{opacity:1}}
.li-actions button{padding:6px;border-radius:6px;color:var(--text-3)}
.li-actions button:hover{background:var(--primary-light);color:var(--primary)}
.li-actions button.del:hover{background:var(--danger-bg);color:var(--danger)}
.li-actions svg{width:15px;height:15px}
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.goal-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),#7c3aed)}
.gc-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px;padding-right:60px}
.gc-ring{flex-shrink:0;position:relative;width:56px;height:56px}
.gc-ring svg{transform:rotate(-90deg)}
.gc-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--primary)}
.gc-info{flex:1;min-width:0}
.gc-title{font-weight:700;font-size:15px;margin-bottom:4px;word-break:break-word}
.gc-meta{font-size:12px;color:var(--text-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gc-desc{font-size:13px;color:var(--text-2);margin:10px 0 12px;white-space:pre-wrap;word-break:break-word}
.gc-sub{border-top:1px solid var(--border-2);padding-top:12px}
.gc-sub-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-2);font-weight:600}
.sub-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.sub-item .sc{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sub-item .sc.done{background:var(--success);border-color:var(--success)}
.sub-item .sc.done svg{display:block}
.sub-item .sc svg{width:10px;height:10px;color:#fff;display:none}
.sub-item .st{flex:1;word-break:break-word}
.sub-item .st.done{text-decoration:line-through;color:var(--text-3)}
.sub-item .sdel{opacity:0;color:var(--text-3);padding:2px 4px;border-radius:4px}
.sub-item:hover .sdel{opacity:1}
.sub-item .sdel:hover{color:var(--danger);background:var(--danger-bg)}
.sub-add{display:flex;gap:6px;margin-top:8px}
.sub-add input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none}
.sub-add input:focus{border-color:var(--primary)}
.gc-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.gc-actions button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px;color:var(--text-3);background:rgba(255,255,255,.92);border:1px solid var(--border);cursor:pointer;transition:all .15s ease;opacity:.65}
.gc-actions button svg{width:15px;height:15px;display:block}
.gc-actions button:hover{opacity:1;border-color:var(--primary);background:var(--primary-light);color:var(--primary);transform:translateY(-1px)}
.gc-actions button.del:hover{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.gc-actions button:active{transform:translateY(0) scale(.96)}
.goal-card:hover .gc-actions{opacity:1}
@media(max-width:768px){
  .gc-actions{opacity:1}
  .gc-actions button{opacity:1;width:40px;height:40px;border-radius:10px}
  .gc-actions button svg{width:17px;height:17px}
  .gc-head{padding-right:92px}
}

/* ===== 两级拆解树 ===== */
.gc-sub-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:18px;padding:0 6px;border-radius:9px;background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;margin-left:2px}
.gc-sub-linked{margin-left:auto;color:var(--text-3);font-weight:400}
.sub-tree{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.sub-l1{display:block;padding:10px 8px;border-radius:8px;background:var(--bg);border:1px solid transparent;transition:all .15s;cursor:default}
.sub-l1:hover{border-color:var(--border);background:#fff}
.sub-l1.drag-over{border-color:var(--primary);background:var(--primary-light)}
.sub-l1.dragging{opacity:.45}
.sub-row-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
.sub-row-bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-left:46px}
.sub-row-bottom .sub-ops{margin-left:auto}
.sub-grip{color:var(--text-3);cursor:grab;display:flex;flex-shrink:0;opacity:.5;margin-top:2px}
.sub-grip svg{width:14px;height:14px}
.sub-grip:active{cursor:grabbing}
.sub-l1:hover .sub-grip{opacity:1}
.sub-toggle{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:5px;cursor:pointer;color:var(--text-2);margin-top:2px}
.sub-toggle:hover{background:var(--border-2);color:var(--text)}
.sub-toggle.empty{cursor:default}
.sub-toggle svg{width:14px;height:14px}
.sub-cb{width:18px;height:18px;border:1.8px solid var(--border);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px}
.sub-cb.sm{width:16px;height:16px;margin-top:2px}
.sub-cb:hover{border-color:var(--primary)}
.sub-cb.done{background:var(--success);border-color:var(--success)}
.sub-cb svg{width:11px;height:11px;color:#fff;display:block}
.sub-title{flex:1;min-width:0;font-size:13px;word-break:break-word;cursor:pointer;color:var(--text);line-height:1.4}
.sub-title.sm{font-size:12.5px}
.sub-title:hover{color:var(--primary)}
.sub-title.done{text-decoration:line-through;color:var(--text-3)}
.sub-meta{display:flex;align-items:center;gap:4px;flex-shrink:0;flex-wrap:wrap}
.sub-progress{font-size:11px;color:var(--primary);font-weight:600;background:var(--primary-light);padding:1px 6px;border-radius:8px}
.sub-status{font-size:10.5px;padding:1px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
.sub-st-todo{background:var(--border-2);color:var(--text-2)}
.sub-st-doing{background:#fef3c7;color:#b45309}
.sub-st-done{background:var(--success-bg);color:var(--success)}
.sub-ops{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .15s}
.sub-l1:hover .sub-ops,.sub-l2:hover .sub-ops{opacity:1}
.sub-op{width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:6px;color:var(--text-3);background:transparent;border:none;cursor:pointer}
.sub-op svg{width:14px;height:14px}
.sub-op:hover{background:var(--primary-light);color:var(--primary)}
.sub-op.del:hover{background:var(--danger-bg);color:var(--danger)}
.sub-children{margin-left:26px;padding-left:12px;border-left:2px solid var(--border-2);display:flex;flex-direction:column;gap:2px;margin-top:2px;margin-bottom:2px}
.sub-l2{display:block;padding:8px;border-radius:7px;transition:background .15s}
.sub-l2:hover{background:#fff}
.sub-l2 .sub-row-top{padding-left:16px}
.sub-l2 .sub-row-bottom{padding-left:37px}
.sef-childlist{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.sef-child{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 8px;background:var(--bg);border-radius:6px}
.sef-child .sub-cb{pointer-events:none}
.sef-child .done{text-decoration:line-through;color:var(--text-3)}
@media(max-width:768px){
  .sub-ops{opacity:1}
  .sub-row-bottom{padding-left:0}
  .sub-row-bottom .sub-ops{margin-left:0}
  .sub-l2 .sub-row-top{padding-left:0}
  .sub-l2 .sub-row-bottom{padding-left:0}
}

/* ===== 小弹窗（二级拆解编辑） ===== */
.modal-sm{max-width:440px}

.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.kcol{background:var(--border-2);border-radius:var(--radius);padding:12px;min-height:200px}
.kcol-head{display:flex;align-items:center;gap:8px;padding:4px 6px 12px;font-weight:600;font-size:13px}
.kcol-head .dot{width:8px;height:8px;border-radius:50%}
.kcol-head .dot.todo{background:#9ca3af}.kcol-head .dot.doing{background:var(--warn)}.kcol-head .dot.done{background:var(--success)}
.kcol-head .cnt{margin-left:auto;background:#fff;color:var(--text-2);font-size:11px;padding:1px 8px;border-radius:10px;font-weight:600}
.kcol-body{display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:grab;box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
.kcard:hover{box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.kcard.dragging{opacity:.5;cursor:grabbing}
.kcard .kc-title{font-weight:500;font-size:13px;margin-bottom:8px;word-break:break-word}

/* ============ Constants ============ */
var DATABASE_ID = 'HHhhQsiXJHBqyPHFqhFl39';
var STORAGE_KEY = 'wb_focusdesk_v1';
var STORAGE_PENDING_KEY = 'wb_focusdesk_pending';
var STORAGE_DEL_KEY = 'wb_focusdesk_deleted'; // 多端安全：显式删除标记（谁删的、删哪张表）
var TYPE_TASK='任务', TYPE_IDEA='灵感', TYPE_GOAL='目标';

function uid(){ return 'r_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(s){ if(!s)return ''; var d=new Date(s); if(isNaN(d))return s; return d.getMonth()+1+'月'+d.getDate()+'日'; }
function fmtDateTime(s){
  if(!s) return '';
  var d = new Date(s);
  if(isNaN(d)) return s;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtCreated(s){
  if(!s) return '';
  var d = new Date(s);
  if(isNaN(d)) return '';
  var now = new Date();
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  var hh = String(d.getHours()).padStart(2,'0');
  var mm = String(d.getMinutes()).padStart(2,'0');
  if(sameDay) return '今天 '+hh+':'+mm;
  var yest = new Date(now); yest.setDate(now.getDate()-1);
  var isYest = d.getFullYear()===yest.getFullYear() && d.getMonth()===yest.getMonth() && d.getDate()===yest.getDate();
  if(isYest) return '昨天 '+hh+':'+mm;
  return (d.getMonth()+1)+'/'+d.getDate();
}
function daysBetween(a,b){ var da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00'); return Math.round((db-da)/86400000); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function escapeHtml(s){ if(s==null)return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* 同组内按截止日期(dueDate)升序排序：有日期在前、无日期置后、均无则按创建时间倒序 */
function cmpByDueDate(a, b){
  var da = a.dueDate || '', db = b.dueDate || '';
  if(da && db) return da < db ? -1 : (da > db ? 1 : 0);
  if(da && !db) return -1;
  if(!da && db) return 1;
  var ca = a.createdAt || '', cb = b.createdAt || '';
  if(ca === cb) return 0;
  return ca > cb ? -1 : 1;
}
/* 中性"截止日期"徽标，用于已完成等不显示紧急色的状态 */
function dueDateBadge(dueStr){

}

/* ============ State & Data Layer ============ */
var State = {
  records: [],        // all tasks/ideas/goals (from db or local)
  loaded: false,

  kanbanGoal: '',     // 看板按所属目标筛选
  kanbanOwner: '',    // 看板按归属筛选
  habits: [],         // 长期打卡：习惯定义（从系统记录加载）
  habitLogs: [],      // 长期打卡：打卡日志 [{habitId,date,completedAt}]
  pendingOps: []      // offline queued operations
};

}

function setSync(status, text){
  var dot = document.getElementById('syncDot');
  var txt = document.getElementById('syncText');
  dot.className = 'dot ' + status;
  txt.textContent = text;
}

function loadLocal(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) State.records = JSON.parse(raw);
    var pend = localStorage.getItem(STORAGE_PENDING_KEY);
    if(pend) State.pendingOps = JSON.parse(pend);
  } catch(e){ console.warn('local load failed', e); }
}

function saveLocal(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(State.records));
    localStorage.setItem(STORAGE_PENDING_KEY, JSON.stringify(State.pendingOps));
  } catch(e){ console.warn('local save failed', e); }
  // 轻量路径：登录并在线时，防抖触发云端全量 reconcile（数据量小，全量最稳）
  if(window.WB_Cloud && WB_Cloud.enabled && WB_Cloud.isCloud()){
    WB_Cloud.schedulePush();
  }
}

function toast(msg, isErr){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className='toast'; }, 2200);
}

/* Normalize a record from db query into local shape */
function normRecord(row){
  var rec = { id: row.record_id || row._id, _local: false };
  var props = row;
  rec.title = getText(props['标题']);
  rec.type = getSelectText(props['类型']);
  rec.status = getSelectText(props['状态']);
  rec.priority = getSelectText(props['优先级']);
  rec.owner = getSelectText(props['归属']);
  rec.goal = getText(props['所属目标']);
  rec.dueDate = getDateValue(props['截止日期']);
  rec.tags = getText(props['标签']);
  // 关键：必须从【原始备注】解析子任务，再提取纯文本 note；
  // 若先 getNoteBody() 会把 JSON 围栏删掉，导致刷新后子任务全部丢失。
  var rawNote = getText(props['内容备注']);
  rec.subtasks = parseSubtasks(rawNote);
  rec.habits = parseHabits(rawNote);
  rec.habitLogs = parseHabitLogs(rawNote);
  rec.note = getNoteBody(rawNote);
  rec.createdAt = getDateValue(props['创建时间']) || nowISO();
  rec.completedAt = getDateValue(props['完成时间']);
  rec.order = getNumber(props['看板排序']) || 0;
  return rec;
}

function getText(v){
  if(v==null) return '';
  if(typeof v === 'string') return v;
  if(Array.isArray(v)) return v.map(function(x){ return x.text||x; }).join('');
  if(typeof v === 'object' && v.text) return v.text;
  return String(v);
}
function getSelectText(v){
  if(v==null) return '';
  if(typeof v === 'string') return v;
  if(Array.isArray(v) && v.length) return v[0].text || v[0].id || '';
  if(typeof v === 'object') return v.text || v.id || '';
  return '';
}
function getDateValue(v){
  if(v==null) return '';
  if(typeof v === 'string') return v.slice(0,10);
  if(typeof v === 'number') return new Date(v).toISOString().slice(0,10);
  if(typeof v === 'object' && v.value) return new Date(v.value).toISOString().slice(0,10);
  return '';
}
function getNumber(v){
  if(typeof v === 'number') return v;
  if(typeof v === 'string') return parseFloat(v)||0;
  if(typeof v === 'object' && v.value != null) return parseFloat(v.value)||0;
  return 0;
}
function parseSubtasks(note){
  if(!note) return [];
  // 优先解析 JSON fence（支持二级子任务与完整字段）
  var fence = note.match(/<!-- FOCUSDESK_SUBS\s+([\s\S]*?)\s*-->/);
  if(fence){
    try {
      var arr = JSON.parse(fence[1]);
      if(Array.isArray(arr)){
        return arr.map(normSub);
      }
    } catch(e){ /* fall through to legacy */ }
  }
  // 兼容旧格式: - [x] text
  var lines = note.split('\n');
  var subs = [];
  lines.forEach(function(l){
    var m = l.match(/^- \[([ x])\] (.*)$/);
    if(m) subs.push(normSub({ text: m[2], done: m[1]==='x' }));
  });
  return subs;
}
function normSub(s){
  if(s==null) return null;
  if(typeof s==='string') return { id: uid(), text: s, done:false, note:'', status:'', priority:'', dueDate:'', createdAt:'', completedAt:'', collapsed:false, children:[] };
  return {
    id: s.id || uid(),
    text: s.text || '',
    done: !!s.done,
    note: s.note || '',
    status: s.status || '',
    priority: s.priority || '',
    dueDate: s.dueDate || '',
    createdAt: s.createdAt || '',
    completedAt: s.completedAt || '',
    collapsed: !!s.collapsed,
    children: Array.isArray(s.children) ? s.children.map(normSub2) : []
  };
}
function normSub2(s){
  if(s==null) return null;
  if(typeof s==='string') return { id: uid(), text: s, done:false, note:'', priority:'', dueDate:'', createdAt:'', completedAt:'' };
  return {
    id: s.id || uid(),
    text: s.text || '',
    done: !!s.done,
    note: s.note || '',
    priority: s.priority || '',
    dueDate: s.dueDate || '',
    createdAt: s.createdAt || '',
    completedAt: s.completedAt || ''
  };
}
function getNoteBody(note){
  if(!note) return '';
  return note.split('\n').filter(function(l){
    if(/^- \[[ x]\] /.test(l)) return false;
    if(/^<!-- FOCUSDESK_SUBS/.test(l)) return false;
    if(/^<!-- FOCUSDESK_HABITS/.test(l)) return false;
    if(/^<!-- FOCUSDESK_HABIT_LOGS/.test(l)) return false;
    if(/^-->/.test(l)) return false;
    return true;
  }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function countSubLeaves(subs){
  var total=0, done=0;
  (subs||[]).forEach(function(s){
    if(s.children && s.children.length){
      s.children.forEach(function(c){
        total++; if(c.done) done++;
      });
    } else {
      total++; if(s.done) done++;
    }
  });
  return { total:total, done:done };
}
function computeSubStatus(s){
  if(!s.children || !s.children.length) return s.status;
  var allDone = s.children.every(function(c){return c.done;});
  if(allDone) return ST_DONE;
  var anyActive = s.children.some(function(c){return c.done;});
  if(anyActive) return ST_DOING;
  return ST_TODO;
}

/* Load schema options for selects */
function loadSchema(){
  if(!db) return Promise.resolve();
  return db.getSchema({ databaseId: DATABASE_ID }).then(function(schema){
    (schema.properties||[]).forEach(function(f){
      if((f.type==='select'||f.type==='multi_select') && f.config && f.config.options){
        Schema.options[f.name] = f.config.options;
      }
    });
  }).catch(function(){ /* fallback defaults */ });
}

/* Fetch all records from db */
function fetchFromDB(){
  if(!db) return Promise.reject(new Error('no sdk'));
  setSync('syncing','同步中...');
  return db.query({ databaseId: DATABASE_ID, pageSize: 100, sorts: [{property:'看板排序',direction:'ascending'}] })
    .then(function(res){
      State.records = (res.results||[]).map(normRecord);
      State.online = true;
      setSync('', '已同步');
      saveLocal();
      return State.records;
    }).catch(function(err){
      console.warn('db query failed, using local', err);
      State.online = false;
      setSync('offline','离线模式');
      return State.records;
    });
}

/* Build properties payload for addRecord/updateRecord */
function buildProperties(rec){
  var p = {};
  p['标题'] = { text: rec.title || '' };
  if(rec.type) p['类型'] = { select: findOptionId('类型', rec.type) || rec.type };
  if(rec.status) p['状态'] = { select: findOptionId('状态', rec.status) || rec.status };
  if(rec.priority) p['优先级'] = { select: findOptionId('优先级', rec.priority) || rec.priority };
  if(rec.owner) p['归属'] = { select: findOptionId('归属', rec.owner) || rec.owner };
  if(rec.goal != null) p['所属目标'] = { text: rec.goal };
  if(rec.dueDate) p['截止日期'] = { date: rec.dueDate };
  if(rec.tags != null) p['标签'] = { text: rec.tags };
  p['内容备注'] = { text: serializeNote(rec) };
  if(rec.createdAt) p['创建时间'] = { date: rec.createdAt.slice(0,10) };
  if(rec.completedAt) p['完成时间'] = { date: rec.completedAt.slice(0,10) };
  if(typeof rec.order === 'number') p['看板排序'] = { number: rec.order };
  return p;
}
function findOptionId(fieldName, text){
  var opts = Schema.options[fieldName];
  if(!opts) return null;
  for(var i=0;i<opts.length;i++){ if(opts[i].text===text) return opts[i].id; }
  return null;
}
function serializeNote(rec){
  var parts = [];
  if(rec.note) parts.push(rec.note);
  if(rec.subtasks && rec.subtasks.length){
    // 新格式：JSON fence，保留二级子任务与完整字段
    parts.push('<!-- FOCUSDESK_SUBS ' + JSON.stringify(rec.subtasks) + ' -->');
  }
  if(rec.habits && rec.habits.length){
    parts.push('<!-- FOCUSDESK_HABITS ' + JSON.stringify(rec.habits) + ' -->');
  }
  if(rec.habitLogs && rec.habitLogs.length){
    parts.push('<!-- FOCUSDESK_HABIT_LOGS ' + JSON.stringify(rec.habitLogs) + ' -->');
  }
  return parts.join('\n');
}

/* ============ Long-term check-in (habits) ============ */
// 习惯数据不占「类型」字段（DB 类型为固定 select 选项，避免云端拒绝新值），
// 全部存于一条隐藏系统记录 title='__focusdesk_habits__' 的「内容备注」围栏：
//   <!-- FOCUSDESK_HABITS [...] -->        习惯定义数组
//   <!-- FOCUSDESK_HABIT_LOGS [...] -->    打卡日志数组
var HABIT_SYSTEM_TITLE = '__focusdesk_habits__';
function parseHabits(note){
  if(!note) return [];
  var fence = note.match(/<!-- FOCUSDESK_HABITS\s+([\s\S]*?)\s*-->/);
  if(fence){
    try {
      var arr = JSON.parse(fence[1]);
      if(Array.isArray(arr)) return arr.map(normHabit);
    } catch(e){}
  }
  return [];
}
function parseHabitLogs(note){
  if(!note) return [];
  var fence = note.match(/<!-- FOCUSDESK_HABIT_LOGS\s+([\s\S]*?)\s*-->/);
  if(fence){
    try {
      var arr = JSON.parse(fence[1]);
      if(Array.isArray(arr)) return arr;
    } catch(e){}
  }
  return [];
}
function normHabit(h){
  if(h==null) return null;
  if(typeof h==='string') return { id: uid(), title: h, mode:'weekday', weekdays:[], countPerWeek:0, createdAt: todayISO(), note:'' };
  return {
    id: h.id || uid(),
    title: h.title || '',
    note: (typeof h.note==='string') ? h.note : '',
    mode: (h.mode==='count') ? 'count' : 'weekday',
    weekdays: Array.isArray(h.weekdays) ? h.weekdays.map(Number).filter(function(x){return x>=0&&x<=6;}) : [],
    countPerWeek: parseInt(h.countPerWeek,10) || 0,
    createdAt: h.createdAt || todayISO()
  };
}
// 隐藏标记：title 以 __ 开头的系统记录，不出现在任何业务视图/统计
function isRecordHidden(r){
  return !!(r && (r.title||'').indexOf('__')===0);
}
function getHabitSystemRec(){
  var rec = State.records.find(function(r){ return r.title===HABIT_SYSTEM_TITLE; });
  if(!rec){
    rec = { title: HABIT_SYSTEM_TITLE, type: TYPE_TASK, status: ST_TODO, note:'', subtasks:[], habits:[], habitLogs:[] };
    addRecord(rec);
  }
  return rec;
}
function loadHabits(){
  var rec = getHabitSystemRec();
  State.habits = rec.habits || [];
  State.habitLogs = rec.habitLogs || [];
}
function saveHabitsToRecord(){
  var rec = getHabitSystemRec();
  rec.habits = State.habits;
  rec.habitLogs = State.habitLogs;
  updateRecord(rec);
}
// 周一=0 … 周日=6（与日历 startWeekday 公式一致）
function getHabitWeekday(dateISO){
  var d = new Date((dateISO||todayISO())+'T00:00:00');
  return (d.getDay()+6)%7;
}
// 本周（周一~周日）已打卡次数
function countHabitDoneThisWeek(habitId, dateISO){
  var t = new Date((dateISO||todayISO())+'T00:00:00');
  var wd = (t.getDay()+6)%7;
  var mon = new Date(t); mon.setDate(t.getDate()-wd);
  var monISO = toISODate(mon);
  var nextMon = new Date(mon); nextMon.setDate(mon.getDate()+7);
  var nextMonISO = toISODate(nextMon);
  return State.habitLogs.filter(function(l){
    return l.habitId===habitId && l.date>=monISO && l.date<nextMonISO;
  }).length;
}
function isHabitDueOn(habit, dateISO){
  if(!habit) return false;
  if(isHabitCompletedOn(habit.id, dateISO)) return false;
  if(habit.mode==='count'){
    // 每天显示直到本周达标
    return countHabitDoneThisWeek(habit.id, dateISO) < (habit.countPerWeek||0);
  }
  return habit.weekdays.indexOf(getHabitWeekday(dateISO)) >= 0;
}
function isHabitCompletedOn(habitId, dateISO){
  return State.habitLogs.some(function(l){ return l.habitId===habitId && l.date===dateISO; });
}
function getHabitStats(habitId){
  var logs = State.habitLogs.filter(function(l){ return l.habitId===habitId; });
  var cumulative = logs.length;
  var lastCheckIn = '';
  logs.forEach(function(l){ if(l.completedAt && l.completedAt > lastCheckIn) lastCheckIn = l.completedAt; });
  return { cumulative: cumulative, lastCheckIn: lastCheckIn };
}
// 今天待打卡的习惯（今天页面顶部区块用）
function getHabitDueToday(){
  var today = todayISO();
  return State.habits.filter(function(h){ return isHabitDueOn(h, today); });
}
function computeHabitStats(){
  var today = todayISO();
  var y = parseInt(today.slice(0,4),10), mo = parseInt(today.slice(5,7),10);
  var month = today.slice(0,7);
  var cumulative = State.habitLogs.length;
  var lastCheckIn = '';
  State.habitLogs.forEach(function(l){ if(l.completedAt && l.completedAt > lastCheckIn) lastCheckIn = l.completedAt; });
  var monthlyActual = State.habitLogs.filter(function(l){ return (l.date||'').indexOf(month)===0; }).length;
  var monthlyExpected = 0;
  var dim = new Date(y, mo, 0).getDate();
  State.habits.forEach(function(h){
    if(h.mode==='count'){
      monthlyExpected += Math.round((dim/7) * (h.countPerWeek||0));
    } else {
      for(var d=1; d<=dim; d++){
        var iso = y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        if(h.weekdays.indexOf(getHabitWeekday(iso))>=0) monthlyExpected++;
      }
    }
  });
  var rate = monthlyExpected ? Math.round(monthlyActual/monthlyExpected*100) : 0;
  return { cumulative: cumulative, lastCheckIn: lastCheckIn, monthlyActual: monthlyActual, monthlyExpected: monthlyExpected, rate: rate };
}
function addHabit(data){

/* CRUD: returns Promise, falls back to local when offline */
function addRecord(rec){
  rec.id = rec.id || uid();
  rec.createdAt = rec.createdAt || nowISO();
  rec.subtasks = rec.subtasks || [];
  State.records.push(rec);
  saveLocal();
  if(db && State.online){
    setSync('syncing','同步中...');
    return db.addRecord({ databaseId: DATABASE_ID, properties: buildProperties(rec) })
      .then(function(res){
        var newId = (res && (res.record_id || res.id || res._id)) || rec.id;
        rec.id = newId; saveLocal();
        setSync('','已同步');
        return rec;
      }).catch(function(err){
        console.warn('add failed', err);
        queueOp('add', rec);
        setSync('offline','离线模式');
        return rec;
      });
  }
  queueOp('add', rec);
  setSync('offline','离线模式');
  return Promise.resolve(rec);
}

function updateRecord(rec){
  var idx = -1;
  for(var i=0;i<State.records.length;i++){ if(State.records[i].id===rec.id){idx=i;break;} }
  if(idx>=0) State.records[idx] = rec;
  saveLocal();
  var isLocalOnly = !rec.id || rec.id.indexOf('r_')===0;
  if(db && State.online){
    setSync('syncing','同步中...');
    if(isLocalOnly){
      // record not yet on server, add it
      return db.addRecord({ databaseId: DATABASE_ID, properties: buildProperties(rec) })
        .then(function(res){
          var newId = (res && (res.record_id || res.id || res._id)) || rec.id;
          if(newId !== rec.id){ rec.id = newId; if(idx>=0) State.records[idx]=rec; }
          setSync('','已同步'); saveLocal(); return rec;
        })
        .catch(function(){ queueOp('update', rec); setSync('offline','离线模式'); return rec; });
    }
    return db.updateRecord({ databaseId: DATABASE_ID, recordId: rec.id, properties: buildProperties(rec) })
      .then(function(){ setSync('','已同步'); return rec; })
      .catch(function(){ queueOp('update', rec); setSync('offline','离线模式'); return rec; });
  }
  queueOp('update', rec);
  return Promise.resolve(rec);
}

function deleteRecord(id){
  var delRec = State.records.find(function(r){return r.id===id;});
  State.records = State.records.filter(function(r){return r.id!==id;});
  // 多端安全：记录删除标记（含所属表），云端删除只针对显式标记，避免其他浏览器误删/复活
  if(delRec && delRec.id){
    try {
      var dm = JSON.parse(localStorage.getItem(STORAGE_DEL_KEY) || '{}');
      dm[delRec.id] = { table: (delRec.type===TYPE_GOAL ? 'fd_goals' : 'fd_tasks'), ts: Date.now() };
      localStorage.setItem(STORAGE_DEL_KEY, JSON.stringify(dm));
    } catch(e){}
  }
  saveLocal();
  // 轻量路径：删除属低频操作，立即推送云端（不等防抖，避免删后立刻刷新导致云端旧数据被拉回）
  if(window.WB_Cloud && WB_Cloud.enabled && WB_Cloud.isCloud()){
    WB_Cloud.pushAll().catch(function(){});
  }
  var isServerId = id && id.indexOf('r_')!==0;
  if(db && State.online && isServerId){
    return db.deleteRecord({ databaseId: DATABASE_ID, recordId: id })
      .catch(function(){ queueOp('delete', {id:id}); });
  }
  queueOp('delete', {id:id});
  return Promise.resolve();
}

function queueOp(op, payload){
  State.pendingOps.push({ op: op, payload: payload, ts: Date.now() });
  saveLocal();
}

/* ============ Helpers for rendering ============ */
function priorityTag(p){
  if(!p) return '';
  var cls = PRIORITY_COLORS[p] || 'p3';
  return '<span class="tag tag-'+cls+'">'+escapeHtml(p)+'</span>';
}
function ownerTag(o){
  if(!o) return '';
  var cls = OWNER_TAGS[o];
  if(!cls) return '';
  return '<span class="tag tag-'+cls+'">'+escapeHtml(o)+'</span>';
}
function typeTag(t){
  if(!t) return '';
  var map = { '任务':'task','灵感':'idea','目标':'goal' };
  return '<span class="tag tag-'+(map[t]||'task')+'">'+escapeHtml(t)+'</span>';
}
function dueTag(dueStr, status){
  if(!dueStr || status===ST_DONE) return '';
  var today = todayISO();
  var diff = daysBetween(today, dueStr);
  if(diff < 0) return '<span class="due overdue">逾期 '+Math.abs(diff)+'天</span>';
  if(diff === 0) return '<span class="due overdue">今天到期</span>';
  if(diff <= 2) return '<span class="due" style="color:var(--warn)">'+diff+'天后</span>';
  return '<span class="due">'+fmtDate(dueStr)+'</span>';
}
// 任务状态判定规则：
//   终态（不再计入"未完成的逾期"）  = 已完成(ST_DONE) 或 已归档(ST_ARCHIVE)
//   活跃态（可能在逾期范围内）      = 待处理(ST_TODO) / 进行中(ST_DOING)
// 已归档任务由"自动归档"功能产生，本质属于已完成，必须从逾期统计中排除。
function isActiveTask(r){
  return r.status !== ST_DONE && r.status !== ST_ARCHIVE;
}
// 已实质完成（含已归档）：用于"已完成数量 / 完成率 / 完成趋势"统计口径。
// 已归档任务由"自动归档"产生，本质属于已完成，应计入完成统计，但不计入逾期。
function isCompletedOrArchived(r){
  return r.status === ST_DONE || r.status === ST_ARCHIVE;
}
// 逾期时间阈值：按"日期（date-only）"比较，截止日期 < 今日即为逾期；今日到期归入"今天到期"，不算逾期。
// 逾期判定 = 任务处于活跃态（未完成且未归档） 且 截止日期早于今日。
function isOverdue(r){
  return !!(r.dueDate) && isActiveTask(r) && daysBetween(todayISO(), r.dueDate) < 0;
}
function isToday(r){
  return !!(r.dueDate) && isActiveTask(r) && daysBetween(todayISO(), r.dueDate)===0;
}
function isTodoLike(r){
  return r.type===TYPE_TASK && (r.status===ST_TODO || r.status===ST_DOING);
}

/* ============ Today view ============ */
var HABIT_WEEK_NAMES = ['一','二','三','四','五','六','日'];
function habitPeriodText(h){
  if(!h) return '';
  if(h.mode==='count') return '每周固定 '+h.countPerWeek+' 次';
  var days = (h.weekdays||[]).map(function(w){ return '周'+HABIT_WEEK_NAMES[w]; }).join('、');
  return days ? '每周 '+days : '未设置周期';
}
// "今天要处理" 下方的长期打卡区块（无数据也显示，保留「新增」入口）
function renderHabitSection(){
  var today = todayISO();
  var hasAny = !!(State.habits && State.habits.length);
  var h = '';
  h += '<section class="habit-section">';
  h += '<div class="habit-section-head"><h3>长期打卡</h3>';
  h += '<button class="btn btn-sm btn-ghost" data-habit-act="add">'+ICONS.plus+' 新增</button></div>';
  if(!hasAny){
    h += '<div class="habit-empty">还没有长期打卡任务，点击「新增」创建一个吧（如：每周一三五运动 / 每周跑步3次）。</div>';
  } else {
    h += '<div class="habit-list">';
    State.habits.forEach(function(hab){
      var due = isHabitDueOn(hab, today);
      var done = isHabitCompletedOn(hab.id, today);
      var cls = done ? 'habit-done' : (due ? 'habit-due' : 'habit-idle');
      var st = getHabitStats(hab.id);
      var lastText = st.lastCheckIn ? fmtDateTime(st.lastCheckIn) : '—';
      h += '<div class="habit-item '+cls+'" data-habit-id="'+hab.id+'" title="'+escapeHtml(habitPeriodText(hab))+'">';
      h += '<div class="habit-main">';
      h += '<div class="habit-name">'+escapeHtml(hab.title)+'</div>';
      if(hab.note) h += '<div class="habit-note">'+escapeHtml(hab.note)+'</div>';
      h += '<div class="habit-stats-line"><b>累计打卡 '+st.cumulative+' 次</b><span>|</span><span>最后打卡：'+lastText+'</span></div>';
      h += '</div>';
      if(done){
        h += '<span class="habit-done-tag">✓ 今日已打卡</span>';
      } else if(due){
        h += '<button class="btn btn-sm btn-primary" data-habit-act="done" data-habit-id="'+hab.id+'">完成</button>';
      }
      h += '<button class="btn btn-sm btn-ghost habit-edit" data-habit-act="edit" data-habit-id="'+hab.id+'" title="编辑">编辑</button>';
      h += '<button class="btn btn-sm btn-ghost habit-del" data-habit-act="del" data-habit-id="'+hab.id+'" title="删除">删除</button>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</section>';
  return h;
}
// 今天页面底部：长期打卡统计
function renderHabitStats(st){
  if(!st || (!st.cumulative && (!State.habits || !State.habits.length))) return '';
  var last = st.lastCheckIn ? fmtDate(st.lastCheckIn.slice(0,10)) : '—';
  return '<div class="habit-stats">长期打卡统计 · 累计 <b>'+st.cumulative+'</b> 次 · 上次 '+last+' · 本月 <b>'+st.monthlyActual+'/'+st.monthlyExpected+'</b> ('+st.rate+'%)</div>';
}
function renderToday(){
  var c = document.getElementById('content');
  var items = [];
  State.records.forEach(function(r){
    if(r.type===TYPE_GOAL) return;
    if(isRecordHidden(r)) return;
    if(r.status===ST_DONE || r.status===ST_ARCHIVE) return;
    if(isOverdue(r)) items.push({r:r,cls:'overdue',reason:'逾期'});
    else if(isToday(r)) items.push({r:r,cls:'today-due',reason:'今日到期'});
    else if(r.status===ST_DOING) items.push({r:r,cls:'',reason:'进行中'});
  });

  // 同步目标拆解产生的叶子子任务到待处理列表
  State.records.filter(function(r){
    return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE && r.status!==ST_DONE;
  }).forEach(function(g){
    (g.subtasks||[]).forEach(function(s, pidx){
      var leaves = [];
      if(s.children && s.children.length){
        s.children.forEach(function(ch, cidx){ if(!ch.done) leaves.push({leaf:ch, cidx:cidx}); });
      } else if(!s.done){
        leaves.push({leaf:s, cidx:-1});
      }
      leaves.forEach(function(ent){
        var leaf = ent.leaf;
        var cls = '', reason = '拆解待办';
        if(leaf.dueDate){
          var diff = daysBetween(todayISO(), leaf.dueDate);
          if(diff < 0){ cls='overdue'; reason='逾期 '+(Math.abs(diff))+'天'; }
          else if(diff===0){ cls='today-due'; reason='今日到期'; }
          else if(diff<=2){ reason=diff+'天后'; }
        }
        items.push({
          isSub:true, goalId:g.id, goalTitle:g.title,
          pidx:pidx, cidx:ent.cidx, leaf:leaf,
          r:{ title:leaf.text, priority:leaf.priority, dueDate:leaf.dueDate, goal:g.title, status:ST_TODO },
          cls:cls, reason:reason
        });
      });
    });
  });

  // sort overdue first, then by due date
  items.sort(function(a,b){
    if(a.cls==='overdue' && b.cls!=='overdue') return -1;
    if(b.cls==='overdue' && a.cls!=='overdue') return 1;
    return (a.r.dueDate||'9999').localeCompare(b.r.dueDate||'9999');
  });

  var h = '';
  h += '<section class="today">';
  h += '<div class="today-head"><h3>今天要处理</h3>';
  h += '<span class="count '+(items.length===0?'zero':'')+'">'+items.length+' 项</span>';
  h += '<span style="color:var(--text-3);font-size:12px;margin-left:auto">'+todayISO()+'</span></div>';
  h += '<div class="today-list">';
  if(items.length===0){
    var completedToday = State.records.filter(function(r){
      return r.type===TYPE_TASK && r.status===ST_DONE && r.completedAt && r.completedAt.slice(0,10)===todayISO();
    }).length;
    var pendingTotal = State.records.filter(function(r){
      return r.type===TYPE_TASK && (r.status===ST_TODO||r.status===ST_DOING);
    }).length;
    h += '<div class="today-clear">';
    h += '<div class="tc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></div>';
    h += '<div class="tc-title">今天没有待处理事项</div>';
    if(completedToday>0){
      h += '<div class="tc-sub">今天已完成 '+completedToday+' 项任务，继续保持！</div>';
    } else if(pendingTotal>0){
      h += '<div class="tc-sub">还有 '+pendingTotal+' 项任务在排期中，享受当下的清闲吧。</div>';
    } else {
      h += '<div class="tc-sub">所有任务都已处理完毕，干得漂亮！</div>';
    }
    h += '<div class="tc-actions">';
    h += '<button class="btn btn-primary btn-sm" data-today-act="addtask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建任务</button>';
    h += '<button class="btn btn-ghost btn-sm" data-today-act="addidea">记录灵感</button>';
    h += '</div></div>';
  } else {
    items.forEach(function(it){
      var r = it.r;
      if(it.isSub){
        // 拆解子任务条目
        h += '<div class="today-item '+it.cls+'" data-sub="1" data-goal-id="'+it.goalId+'" data-pidx="'+it.pidx+'" data-cidx="'+it.cidx+'">';
        h += '<span class="ti-cb" data-act="subcomplete" title="标记完成" data-goal-id="'+it.goalId+'" data-pidx="'+it.pidx+'" data-cidx="'+it.cidx+'"></span>';
        h += '<div class="ti-body">';
        h += '<div class="ti-title">'+escapeHtml(r.title)+'</div>';
        h += '<div class="ti-meta">';
        h += '<span class="tag tag-subtask" title="来自目标拆解">拆解</span>';
        h += '<span class="tag tag-goal">'+escapeHtml(it.goalTitle)+'</span>';
        if(r.priority) h += priorityTag(r.priority);
        if(r.dueDate) h += dueTag(r.dueDate, ST_TODO);
        h += '<span class="sub-reason">'+escapeHtml(it.reason)+'</span>';
        h += '</div></div>';
        h += '<button class="btn btn-sm btn-primary" data-act="subcomplete" data-goal-id="'+it.goalId+'" data-pidx="'+it.pidx+'" data-cidx="'+it.cidx+'">完成</button>';
        h += '</div>';
      } else {
        h += '<div class="today-item '+it.cls+'" data-id="'+r.id+'">';
        h += '<div class="ti-title">'+escapeHtml(r.title)+'</div>';
        h += '<div class="ti-meta">';
        if(r.goal) h += '<span class="tag tag-goal">'+escapeHtml(r.goal)+'</span>';
        h += priorityTag(r.priority);
        h += ownerTag(r.owner);
        h += dueTag(r.dueDate, r.status);
        h += '</div>';
        h += '<button class="btn btn-sm btn-primary" data-act="complete" data-id="'+r.id+'">完成</button>';
        if(r.type===TYPE_TASK && r.status!==ST_DOING){
          h += '<button class="btn btn-sm btn-ghost" data-act="start" data-id="'+r.id+'">开始</button>';
        }
        h += '</div>';
      }
    });
  }
  h += '</div></section>';

  // 长期打卡区块放在“今天要处理”下方
  h += renderHabitSection();

  // Recent goals progress
  var goals = State.records.filter(function(r){return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE && !isRecordHidden(r);});
  if(goals.length){
    h += '<div class="section-title">目标进度 <span class="ln"></span></div>';
    h += '<div class="goals-grid">';
    goals.slice(0,3).forEach(function(g){ h += renderGoalCard(g, true); });
    h += '</div>';
  }

  h += renderHabitStats(computeHabitStats());   // 长期打卡统计置底

  c.innerHTML = h;
  bindTodayEvents(c);
  bindGoalEvents(c); // 关键：为今日页内嵌的目标卡片绑定编辑/删除/勾选事件
}

function bindTodayEvents(c){
  c.querySelectorAll('[data-act="complete"]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      if(r){ r.status=ST_DONE; r.completedAt=nowISO(); updateRecord(r).then(function(){ renderAll(); toast('已完成'); }); }
    });
  });
  c.querySelectorAll('[data-act="start"]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      if(r){ r.status=ST_DOING; updateRecord(r).then(function(){ renderAll(); toast('已开始'); }); }
    });
  });
  // 拆解子任务打卡：标记完成并回写目标进度
  c.querySelectorAll('[data-act="subcomplete"]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var gid = b.getAttribute('data-goal-id');
      var pidx = parseInt(b.getAttribute('data-pidx'),10);
      var cidx = parseInt(b.getAttribute('data-cidx'),10);
      var g = State.records.find(function(x){return x.id===gid;});
      if(!g) return;
      var parent = g.subtasks[pidx];
      if(cidx===-1){
        // 一级叶子（无二级）
        parent.done = true; parent.status = ST_DONE; parent.completedAt = nowISO();
      } else {
        parent.children[cidx].done = true;
        parent.children[cidx].completedAt = nowISO();
        var st = computeSubStatus(parent);
        parent.status = st; parent.done = (st===ST_DONE);
      }
      // 若目标所有拆解完成，自动标记完成并归档
      var leaves = countSubLeaves(g.subtasks);
      updateRecord(g).then(function(){
        renderAll();
        toast('已完成');
        if(leaves.total>0 && leaves.done===leaves.total && g.status!==ST_ARCHIVE){
          setTimeout(function(){ completeGoalAndArchive(g); }, 600);
        }
      });
    });
  });
  c.querySelectorAll('[data-today-act]').forEach(function(b){
    b.addEventListener('click', function(){
      var act = b.getAttribute('data-today-act');
      if(act==='addtask'){ openEditor({type:TYPE_TASK,status:ST_TODO,subtasks:[],dueDate:todayISO()}); }
      else if(act==='addidea'){ openEditor({type:TYPE_IDEA,status:ST_IDEA,subtasks:[]}); }
    });
  });
  // 长期打卡：完成 / 新增 / 编辑 / 删除
  c.querySelectorAll('[data-habit-act]').forEach(function(b){
    b.addEventListener('click', function(){
      var act = b.getAttribute('data-habit-act');
      var hid = b.getAttribute('data-habit-id');
      if(act==='add'){ openHabitEditor(null); }
      else if(act==='done'){ markHabitDone(hid); }
      else if(act==='edit'){ var hab = State.habits.find(function(x){return x.id===hid;}); if(hab) openHabitEditor(hab); }
      else if(act==='del'){ deleteHabit(hid); }
    });
  });
}

/* ============ Inbox view ============ */
function renderInbox(){
  var c = document.getElementById('content');
  var isIdea = State.inboxTab==='idea';
  var typeLabel = isIdea ? '灵感' : '任务';
  var placeholder = isIdea ? '随手记下灵感、参考资料、可转化的想法...' : '快速记录待办、工作任务、要做的事...';

  h += '<div class="inbox-tabs">';
  h += '<button class="inbox-tab '+(State.inboxTab==='task'?'active':'')+'" data-tab="task">任务收集箱</button>';
  h += '<button class="inbox-tab '+(State.inboxTab==='idea'?'active':'')+'" data-tab="idea">灵感收集箱</button>';
  h += '</div>';
  if(!isIdea){
    h += '<div class="inbox-toolbar"><button class="btn btn-sm btn-ghost" id="hideDoneBtn">'+ICONS.archive+' 一键隐藏已完成任务</button><span class="muted">已完成超过 7 天将自动归档</span></div>';
  }

  h += '<div class="quick-add">';
  h += '<textarea id="qaTitle" placeholder="'+placeholder+'" rows="2"></textarea>';
  h += '<div class="qa-row">';
  if(!isIdea){
    h += '<select id="qaPriority"><option value="P3">P3</option><option value="P2">P2</option><option value="P1" selected>P1</option><option value="P0">P0</option></select>';
    h += '<select id="qaOwner"><option value="">归属</option><option>工作</option><option>个人</option><option>学习</option><option>生活</option></select>';
    h += '<input type="date" id="qaDue" title="截止日期">';
  }
  h += '<input type="text" id="qaTags" placeholder="标签（逗号分隔）" style="min-width:140px;flex:1;max-width:260px">';
  h += '<span class="qa-spacer"></span>';
  h += '<button class="btn btn-primary" id="qaSubmit">'+ICONS.plus+' 添加'+typeLabel+'</button>';
  h += '</div></div>';

  var list = State.records.filter(function(r){
    if(isRecordHidden(r)) return false;
    if(isIdea) return r.type===TYPE_IDEA && r.status!==ST_ARCHIVE;
    return r.type===TYPE_TASK && r.status!==ST_ARCHIVE;
  });
  var pending = list.filter(function(r){return isIdea ? r.status===ST_IDEA : (r.status===ST_TODO);});
  var doing = list.filter(function(r){return r.status===ST_DOING;});
  var done = list.filter(function(r){return r.status===ST_DONE;});
  pending.sort(cmpByDueDate); doing.sort(cmpByDueDate); done.sort(cmpByDueDate);

  if(isIdea){
    h += '<div class="section-title">待转化灵感 <span class="ln"></span> <span style="text-transform:none;font-weight:400;color:var(--text-3)">'+pending.length+'</span></div>';
    h += '<div class="item-list">'+pending.map(function(r){return renderListItem(r,true);}).join('')+'</div>';
    if(doing.length){
      h += '<div class="section-title">已转化为任务 <span class="ln"></span> <span style="text-transform:none;font-weight:400;color:var(--text-3)">'+doing.length+'</span></div>';
      h += '<div class="item-list">'+doing.map(function(r){return renderListItem(r,true);}).join('')+'</div>';
    }
  } else {
    h += '<div class="section-title">待处理 <span class="ln"></span> <span style="text-transform:none;font-weight:400;color:var(--text-3)">'+pending.length+'</span><span class="sort-note">· 按截止日期 早→晚</span></div>';
    h += '<div class="item-list">'+pending.map(function(r){return renderListItem(r,false);}).join('')+'</div>';
    if(doing.length){
      h += '<div class="section-title">进行中 <span class="ln"></span> <span style="text-transform:none;font-weight:400;color:var(--text-3)">'+doing.length+'</span><span class="sort-note">· 按截止日期 早→晚</span></div>';
      h += '<div class="item-list">'+doing.map(function(r){return renderListItem(r,false);}).join('')+'</div>';
    }
  }
  if(done.length){
    h += '<div class="section-title">已完成 <span class="ln"></span> <span style="text-transform:none;font-weight:400;color:var(--text-3)">'+done.length+'</span><span class="sort-note">· 按截止日期 早→晚</span></div>';
    h += '<div class="item-list">'+done.map(function(r){return renderListItem(r,isIdea);}).join('')+'</div>';
  }
  if(list.length===0){
    h += '<div class="empty-state">'+ICONS.empty+' 还没有'+typeLabel+'，在上方输入框开始记录吧</div>';
  }

  c.innerHTML = h;
  bindInboxEvents(c, isIdea);
}

function renderListItem(r, isIdea){
  var done = r.status===ST_DONE;
  var h = '<div class="list-item" data-id="'+r.id+'">';
  h += '<div class="li-check '+(done?'done':'')+'" data-act="toggle">'+(done?ICONS.check:'')+'</div>';
  h += '<div class="li-body">';
  h += '<div class="li-title '+(done?'done':'')+'">'+escapeHtml(r.title)+'</div>';
  if(r.note) h += '<div class="li-note">'+escapeHtml(r.note)+'</div>';
  h += '<div class="li-meta">';
  if(!isIdea) h += priorityTag(r.priority);
  h += ownerTag(r.owner);
  if(r.goal) h += '<span class="tag tag-goal">'+escapeHtml(r.goal)+'</span>';
  if(r.tags) r.tags.split(/[,，]/).filter(Boolean).slice(0,3).forEach(function(t){ h += '<span class="tag tag-type">#'+escapeHtml(t.trim())+'</span>'; });
  if(!isIdea) h += dueTag(r.dueDate, r.status);
  if(!isIdea && r.status===ST_DONE && r.dueDate) h += dueDateBadge(r.dueDate);
  if(r.createdAt) h += '<span class="created-at" title="创建时间">'+fmtCreated(r.createdAt)+'</span>';
  h += '</div></div>';
  h += '<div class="li-actions">';
  if(isIdea && r.status===ST_IDEA){
    h += '<button data-act="totask" title="转为任务">'+ICONS.task+'</button>';
  }
  if(!isIdea && r.status!==ST_DONE){
    h += '<button data-act="linkgoal" title="关联目标">'+ICONS.target+'</button>';
  }
  h += '<button data-act="edit" title="编辑">'+ICONS.edit+'</button>';
  h += '<button class="del" data-act="del" title="删除">'+ICONS.trash+'</button>';
  h += '</div></div>';
  return h;
}

function bindInboxEvents(c, isIdea){

    t.addEventListener('click', function(){ State.inboxTab = t.getAttribute('data-tab'); renderInbox(); });
  });

function bindListEvents(c){
  c.querySelectorAll('.li-check').forEach(function(chk){
    chk.addEventListener('click', function(){
      var id = chk.closest('.list-item').getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      if(!r) return;
      if(r.status===ST_DONE){ r.status=ST_DOING; r.completedAt=''; }
      else { r.status=ST_DONE; r.completedAt=nowISO(); }
      updateRecord(r).then(function(){ renderAll(); });

  });

    b.addEventListener('click', function(){
      var id = b.closest('.list-item').getAttribute('data-id');

    });
  });
  c.querySelectorAll('[data-act="del"]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.closest('.list-item').getAttribute('data-id');
      if(confirm('确定删除这条记录？')){
        deleteRecord(id).then(function(){ renderAll(); toast('已删除'); });
      }
    });
  });
  c.querySelectorAll('[data-act="totask"]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.closest('.list-item').getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      if(r){ r.type=TYPE_TASK; r.status=ST_TODO; updateRecord(r).then(function(){ renderAll(); toast('已转为任务'); }); }
    });
  });
  c.querySelectorAll('[data-act="linkgoal"]').forEach(function(b){
    b.addEventListener('click', function(){
      var id = b.closest('.list-item').getAttribute('data-id');
      var r = State.records.find(function(x){return x.id===id;});
      if(r){ openGoalLinker(r); }
    });
  });
}

/* ============ Goals view ============ */
/* 目标完成：标记完成并归档（子任务全完成自动调用，也可手动点击完成按钮） */
function completeGoalAndArchive(g){
  if(!g || g.status===ST_ARCHIVE) return;
  g.status = ST_ARCHIVE;
  g.completedAt = g.completedAt || nowISO();
  g.archivedAt = nowISO();
  updateRecord(g).then(function(){
    renderAll();
    toast('目标「'+g.title+'」已完成并归档 🎉');
  });
}
/* 拆解任务全部完成 → 自动完成并归档 */
function autoCompleteGoalIfAllDone(g){
  if(!g || g.status===ST_ARCHIVE) return;
  var leaves = countSubLeaves(g.subtasks);
  if(leaves.total>0 && leaves.done===leaves.total){
    setTimeout(function(){ completeGoalAndArchive(g); }, 400);
  }
}

function renderGoals(){
  var c = document.getElementById('content');
  var goals = State.records.filter(function(r){return r.type===TYPE_GOAL && r.status!==ST_ARCHIVE && !isRecordHidden(r);});
  var h = '';
  h += '<div style="display:flex;align-items:center;margin-bottom:16px;gap:10px">';
  h += '<h3 style="font-size:15px;font-weight:700;flex:1">目标追踪</h3>';
  h += '<button class="btn btn-primary btn-sm" id="addGoal">'+ICONS.plus+' 新建目标</button>';
  h += '</div>';

  if(goals.length===0){
    h += '<div class="empty-state">'+ICONS.target+' 还没有目标。新建一个长期或阶段性目标，并拆解成可执行的小任务。</div>';
  } else {
    h += '<div class="goals-grid">';
    goals.forEach(function(g){ h += renderGoalCard(g, false); });
    h += '</div>';
  }
  c.innerHTML = h;
  document.getElementById('addGoal').addEventListener('click', function(){ openEditor({ type:TYPE_GOAL, status:ST_DOING, subtasks:[] }); });
  bindGoalEvents(c);
}

function goalProgress(g){
  var subs = g.subtasks || [];
  if(subs.length===0){
    // count linked tasks
    var linked = State.records.filter(function(r){return r.type===TYPE_TASK && r.goal===g.title;});
    if(linked.length===0) return 0;
    var done = linked.filter(function(r){return r.status===ST_DONE;}).length;
    return Math.round(done/linked.length*100);
  }
  var c = countSubLeaves(subs);
  if(c.total===0) return 0;
  return Math.round(c.done/c.total*100);
}

function renderGoalCard(g, compact){
  var pct = goalProgress(g);
  var R=24, C=2*Math.PI*R;
  var offset = C*(1-pct/100);
  var linked = State.records.filter(function(r){return r.type===TYPE_TASK && r.goal===g.title;});
  var h = '<div class="goal-card" data-id="'+g.id+'">';
  h += '<div class="gc-actions">';
  h += '<button data-act="done" title="标记完成并归档">'+ICONS.check+'</button>';
  h += '<button data-act="edit" title="编辑">'+ICONS.edit+'</button>';
  h += '<button data-act="del" title="删除" class="del">'+ICONS.trash+'</button>';
  h += '</div>';
  h += '<div class="gc-head">';
  h += '<div class="gc-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="'+R+'" fill="none" stroke="#e5e7eb" stroke-width="5"/><circle cx="28" cy="28" r="'+R+'" fill="none" stroke="url(#ggrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+offset+'"/></svg><div class="pct">'+pct+'%</div></div>';
  h += '<div class="gc-info"><div class="gc-title">'+escapeHtml(g.title)+'</div>';
  h += '<div class="gc-meta">';
  if(g.priority) h += priorityTag(g.priority);
  if(g.owner) h += ownerTag(g.owner);
  if(g.dueDate) h += dueTag(g.dueDate, g.status);
  if(g.status===ST_DONE) h += '<span style="display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--success-bg);color:var(--success);">已完成</span>';
  if(g.createdAt) h += '<span class="created-at" title="创建时间">'+fmtCreated(g.createdAt)+'</span>';
  h += '</div></div></div>';
  if(g.note) h += '<div class="gc-desc">'+escapeHtml(g.note)+'</div>';
  var leaves = countSubLeaves(g.subtasks);
  h += '<div class="gc-sub">';
  h += '<div class="gc-sub-head">拆解任务 <span class="gc-sub-count">'+leaves.done+'/'+leaves.total+'</span>';
  if(linked.length) h += '<span class="gc-sub-linked">关联任务 '+linked.length+' · 已完成 '+linked.filter(function(r){return r.status===ST_DONE;}).length+'</span>';
  h += '</div>';
  if(g.subtasks && g.subtasks.length){
    h += '<div class="sub-tree" data-goal="'+g.id+'">';
    g.subtasks.forEach(function(s,i){
      h += renderSubLevel1(g, s, i);
    });
    h += '</div>';
  }
  if(!compact){
    h += '<div class="sub-add"><input type="text" placeholder="添加一级拆解任务，回车确认" data-act="subinput" maxlength="120"><button class="btn btn-sm btn-ghost" data-act="subadd">添加</button></div>';
    h += '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">';
    h += '<button class="btn btn-sm btn-ghost" data-act="addtask">'+ICONS.plus+' 新建关联任务</button>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}

function subEffectiveStatus(s){
  if(s.children && s.children.length){
    return computeSubStatus(s);
  }
  if(s.done) return ST_DONE;
  return s.status || ST_TODO;
}
function subStatusTag(s){
  var st = subEffectiveStatus(s);
  var map = {};
  map[ST_TODO]='sub-st-todo'; map[ST_DOING]='sub-st-doing'; map[ST_DONE]='sub-st-done';
  return '<span class="sub-status '+ (map[st]||'sub-st-todo') +'">'+escapeHtml(st)+'</span>';
}
function renderSubLevel1(g, s, i){
  var hasChildren = s.children && s.children.length;
  var collapsed = !!s.collapsed;
  var childDone = 0;
  if(hasChildren) s.children.forEach(function(c){ if(c.done) childDone++; });
  var st = subEffectiveStatus(s);
  var rowDone = st===ST_DONE;
  var h = '<div class="sub-l1" data-idx="'+i+'" draggable="true">';
  h += '<div class="sub-row-top">';
  h += '<span class="sub-grip" title="拖拽排序">'+ICONS.grip+'</span>';
  h += '<span class="sub-toggle '+(hasChildren?'':'empty')+'" data-act="subtoggle-expand" data-idx="'+i+'">'+(hasChildren?(collapsed?ICONS.chevron:ICONS.chevronDown):'')+'</span>';
  h += '<span class="sub-cb '+(rowDone?'done':'')+'" data-act="subtoggle-all" data-idx="'+i+'" title="完成/取消">'+(rowDone?ICONS.check:'')+'</span>';
  h += '<span class="sub-title '+(rowDone?'done':'')+'" data-act="subedit" data-idx="'+i+'">'+escapeHtml(s.text)+'</span>';
  h += '</div>';
  h += '<div class="sub-row-bottom">';
  if(hasChildren) h += '<span class="sub-progress" title="子任务进度">'+childDone+'/'+s.children.length+'</span>';
  h += subStatusTag(s);
  if(s.priority) h += priorityTag(s.priority);
  if(s.dueDate) h += dueTag(s.dueDate, rowDone?ST_DONE:ST_TODO);
  h += '<span class="sub-ops">';
  h += '<button class="sub-op" data-act="subaddchild" data-idx="'+i+'" title="添加二级任务">'+ICONS.subplus+'</button>';
  h += '<button class="sub-op" data-act="subedit" data-idx="'+i+'" title="编辑">'+ICONS.edit+'</button>';
  h += '<button class="sub-op del" data-act="subdel" data-idx="'+i+'" title="删除">'+ICONS.trash+'</button>';
  h += '</span>';
  h += '</div>';
  h += '</div>';
  if(hasChildren && !collapsed){
    h += '<div class="sub-children">';
    s.children.forEach(function(c, j){
      h += renderSubLevel2(g, s, i, c, j);
    });
    h += '</div>';
  }
  return h;
}
function renderSubLevel2(g, parent, pidx, c, j){
  var h = '<div class="sub-l2">';
  h += '<div class="sub-row-top">';
  h += '<span class="sub-cb sm '+(c.done?'done':'')+'" data-act="childtoggle" data-pidx="'+pidx+'" data-cidx="'+j+'">'+(c.done?ICONS.check:'')+'</span>';
  h += '<span class="sub-title sm '+(c.done?'done':'')+'" data-act="childedit" data-pidx="'+pidx+'" data-cidx="'+j+'">'+escapeHtml(c.text)+'</span>';
  h += '</div>';
  h += '<div class="sub-row-bottom">';
  if(c.priority) h += priorityTag(c.priority);
  if(c.dueDate) h += dueTag(c.dueDate, c.done?ST_DONE:ST_TODO);
  h += '<span class="sub-ops">';
  h += '<button class="sub-op" data-act="childedit" data-pidx="'+pidx+'" data-cidx="'+j+'" title="编辑">'+ICONS.edit+'</button>';
  h += '<button class="sub-op del" data-act="childdel" data-pidx="'+pidx+'" data-cidx="'+j+'" title="删除">'+ICONS.trash+'</button>';
  h += '</span>';
  h += '</div>';
  h += '</div>';
  return h;
}

function bindGoalEvents(c){
  c.querySelectorAll('.goal-card').forEach(function(card){
    var id = card.getAttribute('data-id');
    var g = State.records.find(function(x){return x.id===id;});
    if(!g) return;
    g.subtasks = g.subtasks || [];

    var doneBtn = card.querySelector('[data-act="done"]');
    if(doneBtn) doneBtn.addEventListener('click', function(){ completeGoalAndArchive(g); });
    card.querySelector('[data-act="edit"]').addEventListener('click', function(){ openEditor(g); });
    card.querySelector('[data-act="del"]').addEventListener('click', function(){
      var leaves = countSubLeaves(g.subtasks);
      var linkedCount = State.records.filter(function(r){return r.type===TYPE_TASK && r.goal===g.title;}).length;
      var msg = '确定删除目标「'+g.title+'」？';
      if(leaves.total) msg += '\n该目标下的 '+leaves.total+' 条拆解任务将一并删除。';
      if(linkedCount) msg += '\n已关联的 '+linkedCount+' 个任务不会被删除，仅解除关联。';
      msg += '\n此操作不可撤销。';
      if(confirm(msg)){
        State.records.filter(function(r){return r.type===TYPE_TASK && r.goal===g.title;}).forEach(function(r){
          r.goal=''; updateRecord(r);
        });
        deleteRecord(id).then(function(){ renderAll(); toast('目标已删除'); });
      }
    });

    // ---- 一级任务：勾选（带动子任务）----
    card.querySelectorAll('[data-act="subtoggle-all"]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx=parseInt(b.getAttribute('data-idx'),10);
        var s=g.subtasks[idx];
        var newDone = !subEffectiveStatusIsDone(s);
        s.done = newDone;
        s.completedAt = newDone ? nowISO() : '';
        (s.children||[]).forEach(function(ch){ ch.done=newDone; ch.completedAt=newDone ? nowISO() : ''; });
        s.status = newDone ? ST_DONE : ST_TODO;
        updateRecord(g).then(function(){ renderAll(); if(newDone) autoCompleteGoalIfAllDone(g); });
      });
    });
    // ---- 一级任务：展开/收起 ----
    card.querySelectorAll('[data-act="subtoggle-expand"]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx=parseInt(b.getAttribute('data-idx'),10);
        g.subtasks[idx].collapsed = !g.subtasks[idx].collapsed;
        updateRecord(g).then(function(){ renderAll(); });
      });
    });
    // ---- 一级任务：标题/编辑按钮 -> 打开编辑弹窗 ----
    card.querySelectorAll('[data-act="subedit"]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx=parseInt(b.getAttribute('data-idx'),10);
        openSubEditor(g, idx, null);
      });
    });
    // ---- 一级任务：删除 ----
    card.querySelectorAll('[data-act="subdel"]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx=parseInt(b.getAttribute('data-idx'),10);
        var s=g.subtasks[idx];
        var leafCount = (s.children&&s.children.length) ? s.children.length : 1;
        if(confirm('删除一级任务「'+s.text+'」？其下 '+leafCount+' 条拆解将一并删除。')){
          g.subtasks.splice(idx,1);
          updateRecord(g).then(function(){ renderAll(); toast('已删除'); });
        }
      });
    });
    // ---- 一级任务：添加二级 ----
    card.querySelectorAll('[data-act="subaddchild"]').forEach(function(b){
      b.addEventListener('click', function(){
        var idx=parseInt(b.getAttribute('data-idx'),10);
        var g2 = State.records.find(function(x){return x.id===id;});
        openSubEditor(g2, idx, -1); // -1 = 新建二级
      });
    });

    // ---- 二级任务：勾选 ----
    card.querySelectorAll('[data-act="childtoggle"]').forEach(function(b){
      b.addEventListener('click', function(){
        var pidx=parseInt(b.getAttribute('data-pidx'),10);
        var cidx=parseInt(b.getAttribute('data-cidx'),10);
        var ch=g.subtasks[pidx].children[cidx];
        ch.done=!ch.done;
        ch.completedAt = ch.done ? nowISO() : '';
        // 联动一级状态
        var st = computeSubStatus(g.subtasks[pidx]);
        g.subtasks[pidx].status = st;
        g.subtasks[pidx].done = (st===ST_DONE);
        g.subtasks[pidx].completedAt = (st===ST_DONE) ? nowISO() : '';
        updateRecord(g).then(function(){ renderAll(); });
      });
    });
    // ---- 二级任务：编辑 ----
    card.querySelectorAll('[data-act="childedit"]').forEach(function(b){
      b.addEventListener('click', function(){
        var pidx=parseInt(b.getAttribute('data-pidx'),10);
        var cidx=parseInt(b.getAttribute('data-cidx'),10);
        var g2 = State.records.find(function(x){return x.id===id;});
        openSubEditor(g2, pidx, cidx);
      });
    });
    // ---- 二级任务：删除 ----
    card.querySelectorAll('[data-act="childdel"]').forEach(function(b){
      b.addEventListener('click', function(){
        var pidx=parseInt(b.getAttribute('data-pidx'),10);
        var cidx=parseInt(b.getAttribute('data-cidx'),10);
        var ch=g.subtasks[pidx].children[cidx];
        if(confirm('删除二级任务「'+ch.text+'」？')){
          g.subtasks[pidx].children.splice(cidx,1);
          var st = computeSubStatus(g.subtasks[pidx]);
          g.subtasks[pidx].status = st;
          g.subtasks[pidx].done = (st===ST_DONE);
          updateRecord(g).then(function(){ renderAll(); toast('已删除'); });
        }
      });
    });

    // ---- 添加一级 ----
    var addBtn = card.querySelector('[data-act="subadd"]');
    var inp = card.querySelector('[data-act="subinput"]');
    if(addBtn && inp){
      var doAdd = function(){
        var v = inp.value.trim();
        if(!v) return;
        g.subtasks = g.subtasks||[];
        g.subtasks.push(normSub({text:v, done:false, createdAt: nowISO()}));
        updateRecord(g).then(function(){ renderAll(); });
      };
      addBtn.addEventListener('click', doAdd);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
    }
    var addTaskBtn = card.querySelector('[data-act="addtask"]');
    if(addTaskBtn){
      addTaskBtn.addEventListener('click', function(){
        openEditor({ type:TYPE_TASK, status:ST_TODO, goal:g.title, subtasks:[] });
      });
    }

    // ---- 一级任务拖拽排序 ----
    var tree = card.querySelector('.sub-tree');
    if(tree){
      var dragIdx = null;
      tree.querySelectorAll('.sub-l1').forEach(function(row){
        row.addEventListener('dragstart', function(e){
          dragIdx = parseInt(row.getAttribute('data-idx'),10);
          row.classList.add('dragging');
          try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(dragIdx)); }catch(err){}
        });
        row.addEventListener('dragend', function(){ row.classList.remove('dragging'); dragIdx=null; });
        row.addEventListener('dragover', function(e){ e.preventDefault(); row.classList.add('drag-over'); });
        row.addEventListener('dragleave', function(){ row.classList.remove('drag-over'); });
        row.addEventListener('drop', function(e){
          e.preventDefault(); e.stopPropagation();
          row.classList.remove('drag-over');
          var targetIdx = parseInt(row.getAttribute('data-idx'),10);
          if(dragIdx===null || dragIdx===targetIdx) return;
          var moved = g.subtasks.splice(dragIdx,1)[0];
          g.subtasks.splice(targetIdx,0,moved);
          updateRecord(g).then(function(){ renderAll(); toast('已排序'); });
        });
      });
    }
  });
}

function subEffectiveStatusIsDone(s){
  return subEffectiveStatus(s)===ST_DONE;
}

/* ============ 二级拆解编辑器 (sub modal) ============ */
var SubEditor = { goal:null, pidx:-1, cidx:-2, isNewChild:false, backup:null };
function openSubEditor(goal, pidx, cidx){
  SubEditor.goal = goal;
  SubEditor.pidx = pidx;
  SubEditor.cidx = (cidx==null ? null : cidx);
  SubEditor.isNewChild = (cidx===-1);
  var parent = goal.subtasks[pidx];
  var rec, title;
  if(cidx===null){
    // 编辑一级
    SubEditor.backup = JSON.stringify(parent);
    rec = parent; title = '编辑一级任务';
  } else if(cidx===-1){
    // 新建二级
    rec = { text:'', note:'', priority:'P2', dueDate:'', done:false };
    title = '为「'+parent.text+'」添加二级任务';
  } else {
    // 编辑二级
    SubEditor.backup = JSON.stringify(parent.children[cidx]);
    rec = parent.children[cidx]; title = '编辑二级任务';
  }
  document.getElementById('subModalTitle').textContent = title;
  renderSubEditorBody(rec, cidx===null);
  document.getElementById('subModalMask').classList.add('show');
  setTimeout(function(){ var t=document.getElementById('sefTitle'); if(t)t.focus(); },50);
}
function closeSubEditor(){
  document.getElementById('subModalMask').classList.remove('show');
  SubEditor.goal=null;
}
function renderSubEditorBody(r, isLevel1){
  var prioOpts = ['P0','P1','P2','P3'].map(function(p){
    return '<option '+(r.priority===p?'selected':'')+'>'+p+'</option>';
  }).join('');
  var statusOpts = [ST_TODO,ST_DOING,ST_DONE].map(function(s){
    return '<option '+(r.status===s?'selected':'')+'>'+s+'</option>';
  }).join('');
  var h = '';
  h += '<div class="form-row"><label>标题</label><input type="text" id="sefTitle" value="'+escapeHtml(r.text||r.title||'')+'" placeholder="任务标题" maxlength="200"></div>';
  if(isLevel1){
    h += '<div class="form-row-2"><div class="form-row"><label>状态</label><select id="sefStatus">'+statusOpts+'</select></div>';
    h += '<div class="form-row"><label>优先级</label><select id="sefPriority">'+prioOpts+'</select></div></div>';
    h += '<div class="form-row"><label>截止日期</label><input type="date" id="sefDue" value="'+(r.dueDate||'')+'"></div>';
  } else {
    h += '<div class="form-row-2"><div class="form-row"><label>优先级</label><select id="sefPriority">'+prioOpts+'</select></div>';
    h += '<div class="form-row"><label>截止日期</label><input type="date" id="sefDue" value="'+(r.dueDate||'')+'"></div></div>';
  }
  h += '<div class="form-row"><label>描述</label><textarea id="sefNote" rows="3" placeholder="补充说明、验收标准...">'+escapeHtml(r.note||'')+'</textarea></div>';
  if(isLevel1 && r.children && r.children.length){
    h += '<div class="form-row"><label>二级任务 ('+r.children.length+')</label><div class="sef-childlist">';
    r.children.forEach(function(ch,i){
      h += '<div class="sef-child"><span class="sub-cb sm '+(ch.done?'done':'')+'">'+(ch.done?ICONS.check:'')+'</span><span class="'+(ch.done?'done':'')+'">'+escapeHtml(ch.text)+'</span></div>';
    });
    h += '</div></div>';
  }
  document.getElementById('subModalBody').innerHTML = h;
}
function saveSubEditor(){
  var se = SubEditor;
  if(!se.goal) return;
  var title = document.getElementById('sefTitle').value.trim();
  if(!title){ toast('请输入标题', true); return; }
  var note = document.getElementById('sefNote').value.trim();
  var priority = document.getElementById('sefPriority').value;
  var dueDate = document.getElementById('sefDue').value;
  var parent = se.goal.subtasks[se.pidx];
  if(se.cidx===null){
    // 保存一级
    parent.text = title; parent.note=note; parent.priority=priority; parent.dueDate=dueDate;
    var stEl = document.getElementById('sefStatus');
    if(stEl){ parent.status=stEl.value; parent.done=(stEl.value===ST_DONE); parent.completedAt=(stEl.value===ST_DONE) ? nowISO() : ''; }
  } else if(se.isNewChild){
    parent.children = parent.children||[];
    parent.children.push(normSub2({ text:title, note:note, priority:priority, dueDate:dueDate, done:false, createdAt: nowISO() }));
  } else {
    var ch = parent.children[se.cidx];
    ch.text=title; ch.note=note; ch.priority=priority; ch.dueDate=dueDate;
  }
  // 重新计算一级状态（基于二级完成情况）
  if(parent.children && parent.children.length){
    var st = computeSubStatus(parent);
    parent.status = st; parent.done = (st===ST_DONE);
    parent.completedAt = (st===ST_DONE) ? (parent.completedAt || nowISO()) : '';
  }
  updateRecord(se.goal).then(function(){
    closeSubEditor(); renderAll(); toast('已保存');
  });
}

/* ============ Kanban view ============ */
function renderKanban(){
  var c = document.getElementById('content');
  // 看板自动汇聚「任务」和「目标」两类条目（新建即自动出现，无需手动添加）
  var boardItems = State.records.filter(function(r){
    return (r.type===TYPE_TASK || r.type===TYPE_GOAL) && r.status!==ST_ARCHIVE && !isRecordHidden(r);
  });
  var cols = [
    { key: ST_TODO, cls:'todo', label:'待处理' },
    { key: ST_DOING, cls:'doing', label:'进行中' },
    { key: ST_DONE, cls:'done', label:'已完成' }
  ];
  // 目标默认状态映射：新建目标若为 ST_TODO/ST_DOING/ST_DONE 直接进入对应列；
  // 其它状态（如遗留 ST_IDEA）不进看板。
  // 筛选值由 State 持有（v27 修复：之前读 DOM.value 会因 innerHTML 重建而视觉重置为"全部"，但筛选状态残留，导致选回"全部"看似失效）
  var kType = State.kanbanType || '';
  var kGoal = State.kanbanGoal || '';
  var kOwner = State.kanbanOwner || '';
  var h = '';
  h += '<div style="display:flex;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap">';

function renderKCard(r){

    var pct = goalProgress(r);

    h += '<span class="tag tag-goal">目标</span>';
    h += '<span style="font-size:11px;color:var(--primary);font-weight:600;margin-left:auto">'+pct+'%</span>';
    h += '</div>';
    h += '<div class="kc-title">'+escapeHtml(r.title)+'</div>';
  } else {
    h += '<div class="kc-title">'+escapeHtml(r.title)+'</div>';
  }
  h += '<div class="kc-meta">';
  if(!isGoal) h += priorityTag(r.priority);
  h += ownerTag(r.owner);
  if(r.goal && !isGoal) h += '<span class="kc-goal">'+escapeHtml(r.goal)+'</span>';
  if(r.dueDate) h += dueTag(r.dueDate, r.status);
  if(r.status===ST_DONE && r.dueDate) h += dueDateBadge(r.dueDate);
  h += '<span class="due" style="color:var(--text-3)">'+fmtCreated(r.createdAt)+'</span>';
  h += '</div>';
  if(isGoal && r.subtasks && r.subtasks.length){

    h += '<div style="height:4px;background:var(--border-2);border-radius:2px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--primary),#7c3aed);border-radius:2px"></div></div>';
    h += '<div style="font-size:11px;color:var(--text-3);margin-top:4px">子任务 '+done+'/'+r.subtasks.length+'</div>';
  }
  h += '<div class="kc-actions">';
  h += '<button data-act="edit">编辑</button>';
  h += '<button class="del" data-act="del">删除</button>';
  h += '</div></div>';
